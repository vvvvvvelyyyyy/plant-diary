<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="植间日记">
  <meta name="theme-color" content="#F5E6D3">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%23F5E6D3'/%3E%3Cpath d='M96 50c-20 0-36 16-36 36 0 8 3 16 8 22-10 4-18 14-18 26 0 16 14 28 32 28h28V50z' fill='%23A8C3A6'/%3E%3Cpath d='M96 50c20 0 36 16 36 36 0 8-3 16-8 22 10 4 18 14 18 26 0 16-14 28-32 28H96V50z' fill='%238FBC8F'/%3E%3Crect x='72' y='140' width='48' height='20' rx='4' fill='%23B8956A'/%3E%3C/svg%3E">
  <title>植间日记</title>
  <style>
    /* ====== 全局变量与基础样式 ====== */
    :root {
      --milk-tea: #F5E6D3;
      --milk-tea-light: #FAF0E2;
      --milk-tea-dark: #E8D5BC;
      --bean-green: #A8C3A6;
      --bean-green-dark: #8FBC8F;
      --bean-green-light: #C8DBC6;
      --text-main: #5A4A3A;
      --text-sub: #8B7B6B;
      --text-light: #B0A090;
      --warn-orange: #E8A87C;
      --warn-red: #E07A5F;
      --warn-yellow: #F2CC8F;
      --card-bg: #FFFFFF;
      --shadow: 0 4px 16px rgba(138, 120, 100, 0.12);
      --shadow-sm: 0 2px 8px rgba(138, 120, 100, 0.08);
      --radius: 20px;
      --radius-sm: 12px;
      --tab-height: 64px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, ".SF NS Rounded", "PingFang SC", "Helvetica Neue", sans-serif;
      background: var(--milk-tea);
      color: var(--text-main);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    input, textarea {
      user-select: text;
      -webkit-user-select: text;
    }

    #app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ====== 页面容器 ====== */
    .page {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: none;
      flex-direction: column;
    }
    .page.active {
      display: flex;
    }

    /* ====== 顶部标题栏 ====== */
    .page-header {
      background: var(--milk-tea);
      padding: 12px 16px 8px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .page-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
    }
    .page-subtitle {
      font-size: 12px;
      color: var(--text-sub);
      text-align: center;
      margin-top: 2px;
    }

    /* ====== 底部 Tab 栏 ====== */
    .tab-bar {
      height: var(--tab-height);
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      border-top: 1px solid var(--milk-tea-dark);
      position: relative;
      z-index: 20;
    }
    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: var(--text-light);
      cursor: pointer;
      transition: color 0.2s;
    }
    .tab-item svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tab-item span {
      font-size: 10px;
      font-weight: 500;
    }
    .tab-item.active {
      color: var(--bean-green-dark);
    }
    .tab-item.active svg {
      fill: var(--bean-green);
      stroke: var(--bean-green-dark);
    }

    /* ====== 卡片通用样式 ====== */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 16px;
      margin: 0 16px 12px;
    }

    /* ====== 按钮 ====== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 20px;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      background: var(--bean-green);
      color: #fff;
      font-family: inherit;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.4; }
    .btn-secondary {
      background: var(--milk-tea);
      color: var(--text-main);
    }
    .btn-outline {
      background: transparent;
      border: 2px solid var(--bean-green);
      color: var(--bean-green-dark);
    }
    .btn-danger {
      background: var(--warn-red);
    }
    .btn-sm {
      padding: 8px 14px;
      font-size: 13px;
    }
    .btn-block {
      width: 100%;
      display: flex;
    }

    /* ====== 输入框 ====== */
    .input-group {
      margin-bottom: 14px;
    }
    .input-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 6px;
      display: block;
    }
    .input-field, .textarea-field, .select-field {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--milk-tea-dark);
      border-radius: var(--radius-sm);
      font-size: 15px;
      background: var(--milk-tea-light);
      color: var(--text-main);
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .input-field:focus, .textarea-field:focus, .select-field:focus {
      outline: none;
      border-color: var(--bean-green);
      background: #fff;
    }
    .textarea-field {
      resize: none;
      min-height: 70px;
    }
    .required-mark {
      color: var(--warn-red);
      margin-left: 2px;
    }

    /* ====== Toast ====== */
    #toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(90, 74, 58, 0.92);
      color: #fff;
      padding: 14px 24px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      max-width: 80%;
      text-align: center;
    }
    #toast.show {
      opacity: 1;
    }

    /* ====== Modal ====== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(90, 74, 58, 0.5);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal-box {
      background: #fff;
      border-radius: var(--radius);
      padding: 24px;
      max-width: 340px;
      width: 100%;
      box-shadow: var(--shadow);
    }
    .modal-title {
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 12px;
    }
    .modal-text {
      font-size: 14px;
      color: var(--text-sub);
      text-align: center;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .modal-actions {
      display: flex;
      gap: 12px;
    }
    .modal-actions .btn {
      flex: 1;
    }

    /* ====== 空状态 ====== */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--text-light);
    }
    .empty-pot {
      width: 100px;
      height: 110px;
      margin-bottom: 16px;
      position: relative;
    }
    .empty-pot::before {
      content: '';
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 45px;
      background: var(--milk-tea-dark);
      border-radius: 6px 6px 30px 30px / 6px 6px 45px 45px;
    }
    .empty-pot::after {
      content: '';
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 14px;
      background: var(--milk-tea-dark);
      border-radius: 50%;
    }
    .empty-leaf {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 55px;
      background: var(--bean-green-light);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    }
    .empty-state p {
      font-size: 14px;
      text-align: center;
    }

    /* ====== 加载遮罩 ====== */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(245, 230, 211, 0.9);
      z-index: 5000;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    #loading-overlay.show {
      display: flex;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--milk-tea-dark);
      border-top-color: var(--bean-green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 占位图 */
    .img-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--milk-tea-dark), var(--bean-green-light));
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* SVG 图标基础样式 */
    .ico {
      display: inline-block;
      vertical-align: middle;
      width: 1.2em;
      height: 1.2em;
    }
    .ico-lg {
      width: 1.8em;
      height: 1.8em;
    }

    /* 占位图美化 */
    .img-placeholder {
      background: linear-gradient(135deg, var(--milk-tea-dark), var(--bean-green-light));
      position: relative;
    }
    .img-placeholder::after {
      content: '🌱';
      font-size: 28px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
<div id="app">
  <!-- ============ 首页 ============ -->
  <div class="page active" id="page-home">
    <div class="page-header">
      <div class="page-title">植间日记</div>
      <div class="page-subtitle">让每一片叶子都有故事</div>
    </div>
    <div id="home-content" style="padding-bottom:20px;"></div>
  </div>

  <!-- ============ 花园 ============ -->
  <div class="page" id="page-garden">
    <div class="page-header">
      <div class="page-title">我的花园</div>
    </div>
    <div style="padding: 0 16px 12px; position: sticky; top: 52px; background: var(--milk-tea); z-index: 9;">
      <div style="position: relative; margin-bottom: 10px;">
        <input type="text" id="search-input" class="input-field" placeholder="搜索植物昵称或品种..." style="padding-left:36px;">
        <svg style="position:absolute;left:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--text-light);fill:none;stroke-width:2;" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <button id="search-clear" style="display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;color:var(--text-light);cursor:pointer;">✕</button>
      </div>
      <div id="category-tabs" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">
        <select id="location-filter" class="select-field" style="width:auto;padding:8px 12px;font-size:13px;">
          <option value="">全部位置</option>
        </select>
        <button id="batch-toggle" class="btn btn-secondary btn-sm">批量管理</button>
      </div>
    </div>
    <div id="garden-list" style="padding-bottom: 80px;"></div>
    <div id="batch-bar" style="display:none;position:fixed;bottom:var(--tab-height);left:0;right:0;background:#fff;border-top:1px solid var(--milk-tea-dark);padding:12px 16px;z-index:15;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <button id="select-all" class="btn btn-secondary btn-sm">全选</button>
        <span id="batch-count" style="font-size:13px;color:var(--text-sub);">已选 0 棵</span>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-sm batch-action" data-action="water" style="flex:1;display:inline-flex;align-items:center;justify-content:center;gap:4px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>浇水</button>
        <button class="btn btn-sm batch-action" data-action="pest" style="flex:1;background:var(--warn-orange);display:inline-flex;align-items:center;justify-content:center;gap:4px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-4h6l2 4h4"/><path d="M7 12v6a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-6"/><circle cx="12" cy="18" r="1"/><path d="M3 6c1 0 1 2 0 2m4-2c1 0 1 2 0 2"/><path d="M19 6c1 0 1 2 0 2"/></svg>杀虫</button>
        <button class="btn btn-sm batch-action" data-action="repot" style="flex:1;background:var(--bean-green-dark);display:inline-flex;align-items:center;justify-content:center;gap:4px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-2 12H7L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>换盆</button>
      </div>
    </div>
  </div>

  <!-- ============ 鲜花角 ============ -->
  <div class="page" id="page-flower">
    <div class="page-header">
      <div class="page-title">鲜花角</div>
    </div>
    <div id="flower-list" style="padding-bottom:20px;"></div>
  </div>

  <!-- ============ 我的 ============ -->
  <div class="page" id="page-me">
    <div class="page-header">
      <div class="page-title">我的</div>
    </div>
    <div id="me-content" style="padding-bottom:20px;"></div>
  </div>

  <!-- ============ 详情/表单容器（全屏覆盖） ============ -->
  <div id="overlay-page" style="position:fixed;inset:0;background:var(--milk-tea);z-index:500;display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;"></div>

  <!-- ============ 底部Tab ============ -->
  <div class="tab-bar">
    <div class="tab-item active" data-page="home">
      <svg viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1V9.5z"/></svg>
      <span>首页</span>
    </div>
    <div class="tab-item" data-page="garden">
      <svg viewBox="0 0 24 24"><path d="M12 2c-3 4-3 8 0 12"/><path d="M12 14c-4 0-7 2-7 5s3 3 7 3 7 0 7-3-3-5-7-5z"/></svg>
      <span>花园</span>
    </div>
    <div class="tab-item" data-page="flower">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><circle cx="8" cy="13" r="3"/><circle cx="16" cy="13" r="3"/><circle cx="12" cy="17" r="3"/><path d="M12 20v2"/></svg>
      <span>鲜花角</span>
    </div>
    <div class="tab-item" data-page="me">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
      <span>我的</span>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="loading-overlay"><div class="loading-spinner"></div><div style="font-size:14px;color:var(--text-sub);">处理中...</div></div>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-text" id="modal-text"></div>
    <div id="modal-extra"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="modal-cancel">取消</button>
      <button class="btn" id="modal-confirm">确定</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
 * 植间日记 - PWA 植物养护应用
 * 单页 HTML，IndexedDB 存储，北京时间计算
 * ============================================================ */

// ==================== 全局工具 ====================
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));

// 北京时间工具（UTC+8）
const TZ_OFFSET = 8 * 60 * 60 * 1000;
function nowInBeijing() {
  // 返回当前北京时间的 Date 对象
  const now = new Date();
  const utc = now.getTime() + now.getTimezoneOffset() * 60000;
  return new Date(utc + TZ_OFFSET);
}
function todayStr() {
  // 返回 YYYY-MM-DD 格式的北京时间今天
  const d = nowInBeijing();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function formatDateCN(dateStr, withYear = true) {
  if (!dateStr) return '';
  const d = new Date(dateStr + (dateStr.length === 10 ? 'T00:00:00+08:00' : ''));
  if (isNaN(d.getTime())) return dateStr;
  const bj = new Date(d.getTime() + (d.getTimezoneOffset() * 60000) + TZ_OFFSET);
  const m = bj.getMonth() + 1;
  const day = bj.getDate();
  if (withYear) {
    return `${bj.getFullYear()}年${m}月${day}日`;
  }
  return `${m}月${day}日`;
}
function daysBetween(dateStr1, dateStr2) {
  if (!dateStr1 || !dateStr2) return 0;
  const d1 = new Date(dateStr1 + 'T00:00:00');
  const d2 = new Date(dateStr2 + 'T00:00:00');
  return Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
}
function daysFromNow(dateStr) {
  if (!dateStr) return null;
  return daysBetween(dateStr, todayStr());
}

// Toast 提示
function showToast(msg, duration = 2000) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), duration);
}

// ==================== SVG 图标库（替代 emoji 提升兼容性） ====================
function svgIcon(name, opts = {}) {
  const size = opts.size || 16;
  const color = opts.color || 'currentColor';
  const icons = {
    // 叶子/植物
    sprout: `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.4 2.2.7 3.5.6 1.3-.1 2.5-.5 3.5-1.1.3 1.4.4 2.9 0 4.3-.4 1.4-1.2 2.6-2.3 3.5-2.6-1.9-3.8-4.6-4.7-7.3"/></svg>`,
    // 花朵
    flower: `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 16.5A4.5 4.5 0 1 1 7.5 12 4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 1 1 4.5 4.5 4.5 4.5 0 1 1-4.5 4.5"/><path d="M12 7.5V9"/><path d="M7.5 12H9"/><path d="M16.5 12H15"/><path d="M12 16.5V15"/><path d="m8 8 1.88 1.88"/><path d="M14.12 9.88 16 8"/><path d="m8 16 1.88-1.88"/><path d="M14.12 14.12 16 16"/></svg>`,
    // 多肉植物（饱满的莲座状多肉）

function showConfirm(title, text, onConfirm, extraHTML = '') {
  return new Promise((resolve) => {
    const overlay = $('#modal-overlay');
    $('#modal-title').textContent = title;
    $('#modal-text').innerHTML = text;
    $('#modal-extra').innerHTML = extraHTML;
    $('#modal-cancel').onclick = () => { overlay.classList.remove('show'); resolve(false); };

  });
}

// ==================== IndexedDB ====================
const DB_NAME = 'PlantDiaryDB';
const DB_VERSION = 1;
const STORE_PLANTS = 'plants';
const STORE_FLOWERS = 'flowers';
const STORE_META = 'meta';

let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE_PLANTS)) {
        d.createObjectStore(STORE_PLANTS, { keyPath: 'id' });
      }
      if (!d.objectStoreNames.contains(STORE_FLOWERS)) {
        d.createObjectStore(STORE_FLOWERS, { keyPath: 'id' });
      }
      if (!d.objectStoreNames.contains(STORE_META)) {
        d.createObjectStore(STORE_META, { keyPath: 'key' });
      }
    };
  });
}

function dbGetAll(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

function dbGet(store, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbPut(store, obj) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).put(obj);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbDelete(store, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function dbGetMeta(key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_META, 'readonly');
    const req = tx.objectStore(STORE_META).get(key);
    req.onsuccess = () => resolve(req.result ? req.result.value : null);
    req.onerror = () => reject(req.error);
  });
}

function dbSetMeta(key, value) {
  return dbPut(STORE_META, { key, value });
}

// ==================== 图片处理 ====================
function compressImage(file, maxWidth = 720, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxWidth) {
          height = Math.round(height * maxWidth / width);
          width = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve({
          data: canvas.toDataURL('image/jpeg', quality),
          width, height
        });
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// 图片HTML展示（带占位图降级）
function imgTag(base64, cls = '', style = '') {
  if (!base64) {
    return `<div class="img-placeholder ${cls}" style="${style}"></div>`;
  }
  return `<img src="${base64}" class="${cls}" style="${style}" onerror="this.outerHTML='<div class=&quot;img-placeholder&quot;></div>';">`;
}

// ==================== 页面路由 ====================
let currentPage = 'home';

function switchPage(pageName) {
  currentPage = pageName;
  $$('.page').forEach(p => p.classList.toggle('active', p.id === `page-${pageName}`));
  $$('.tab-item').forEach(t => t.classList.toggle('active', t.dataset.page === pageName));
  // 关闭覆盖页
  $('#overlay-page').style.display = 'none';
  $('#overlay-page').scrollTop = 0;

  if (pageName === 'home') renderHome();
  else if (pageName === 'garden') renderGarden();
  else if (pageName === 'flower') renderFlowerList();
  else if (pageName === 'me') renderMe();
}

function openOverlay(html) {
  const overlay = $('#overlay-page');
  overlay.innerHTML = html;
  overlay.style.display = 'flex';
  overlay.scrollTop = 0;
}
function closeOverlay() {
  $('#overlay-page').style.display = 'none';
  $('#overlay-page').innerHTML = '';
  // 刷新当前列表
  if (currentPage === 'garden') renderGarden();
  else if (currentPage === 'flower') renderFlowerList();
  else if (currentPage === 'home') renderHome();
}

// ==================== 首页 ====================
async function renderHome() {
  const container = $('#home-content');
  container.innerHTML = '';
  const plants = await dbGetAll(STORE_PLANTS);
  const flowers = await dbGetAll(STORE_FLOWERS);
  const activePlants = plants.filter(p => !p.isArchived);
  const today = todayStr();

  // 待办清单计算
  const todos = [];
  activePlants.forEach(p => {
    const interval = p.waterInterval || getDefaultWaterInterval(p.plantCategory);
    if (p.lastWateringDate) {
      const days = daysFromNow(p.lastWateringDate);
      if (days >= interval) {
        todos.push({ type: '浇水', svg: 'droplet', name: p.nickname, days, color: 'var(--warn-orange)' });
      }
    } else if (!p.lastWateringDate && daysFromNow(p.plantingDate) >= interval) {
      todos.push({ type: '浇水', svg: 'droplet', name: p.nickname, days: daysFromNow(p.plantingDate), color: 'var(--warn-orange)' });
    }
    // 施肥（默认30天）
    if (p.lastFertilizeDate) {
      const d = daysFromNow(p.lastFertilizeDate);
      if (d >= 30) todos.push({ type: '施肥', svg: 'sprout', name: p.nickname, days: d, color: 'var(--bean-green-dark)' });
    } else if (daysFromNow(p.plantingDate) >= 30) {
      todos.push({ type: '施肥', svg: 'sprout', name: p.nickname, days: daysFromNow(p.plantingDate), color: 'var(--bean-green-dark)' });
    }
    // 换盆（默认365天）
    if (p.lastRepotDate) {
      const d = daysFromNow(p.lastRepotDate);
      if (d >= 365) todos.push({ type: '换盆', svg: 'pot', name: p.nickname, days: d, color: 'var(--milk-tea-dark)' });
    }
  });

  // 鲜切花换水提醒
  flowers.filter(f => !f.isWilted).forEach(f => {
    const interval = f.waterChangeInterval || 2;
    const lastDate = f.lastWaterChangeDate || f.purchaseDate;
    const days = daysFromNow(lastDate);
    if (days >= interval) {
      todos.push({ type: '换水', svg: 'droplet', name: `【鲜切花】${f.cutFlowerName}`, days, color: 'var(--warn-orange)' });
    }
    // 凋谢倒计时
    const remaining = (f.estimatedVaseLife || 7) - daysFromNow(f.purchaseDate);
    if (remaining <= 3 && remaining > 0) {
      todos.push({ type: '即将凋谢', svg: 'flower', name: f.cutFlowerName, days: remaining, color: 'var(--warn-red)' });
    }
  });

  // 概览卡片
  const stats = `
    <div class="card" style="display:flex;gap:12px;text-align:center;margin-top:12px;">
      <div style="flex:1;">
        <div style="font-size:28px;font-weight:800;color:var(--bean-green-dark);">${activePlants.length}</div>
        <div style="font-size:12px;color:var(--text-sub);">盆栽植物</div>
      </div>
      <div style="width:1px;background:var(--milk-tea-dark);"></div>
      <div style="flex:1;">
        <div style="font-size:28px;font-weight:800;color:var(--warn-orange);">${flowers.filter(f=>!f.isWilted).length}</div>
        <div style="font-size:12px;color:var(--text-sub);">鲜切花</div>
      </div>
      <div style="width:1px;background:var(--milk-tea-dark);"></div>
      <div style="flex:1;">
        <div style="font-size:28px;font-weight:800;color:var(--text-sub);">${plants.filter(p=>p.isArchived).length}</div>
        <div style="font-size:12px;color:var(--text-sub);">已归档</div>
      </div>
    </div>
  `;

  // 待办列表
  let todoHTML = '';
  if (todos.length === 0) {
    todoHTML = `
      <div class="card" style="text-align:center;color:var(--text-sub);margin-top:12px;">
        <div style="font-size:36px;margin-bottom:8px;">✨</div>
        <div>今天没有待办任务，植物们都很好哦～</div>
      </div>
    `;
  } else {
    todoHTML = `<div style="padding:0 16px;margin-top:12px;"><div style="font-size:16px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;">${svgIcon('list', {size: 18, color: 'var(--text-main)'})}今日待办 (${todos.length})</div></div>`;
    todos.forEach(t => {

// 左滑手势：左滑露出编辑/删除按钮，再滑收回
let swipeStartX = null;
let swipeStartY = null;
let swipeOffset = 0;
function bindSwipe(el) {
  el.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    swipeStartX = t.clientX;
    swipeStartY = t.clientY;
    swipeOffset = 0;
  }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    if (swipeStartX === null) return;
    const dx = e.touches[0].clientX - swipeStartX;
    const dy = e.touches[0].clientY - swipeStartY;
    // 纵向滑动不触发，避免与页面滚动冲突
    if (Math.abs(dy) > Math.abs(dx)) return;
    swipeOffset = Math.max(-140, Math.min(0, dx));
    el.style.transform = `translateX(${swipeOffset}px)`;
  }, { passive: true });
  el.addEventListener('touchend', () => {
    if (swipeStartX === null) return;
    const open = swipeOffset < -60;
    el.style.transform = open ? 'translateX(-140px)' : 'translateX(0)';
    swipeStartX = null;
  });
}

let gardenState = {

  category: '全部',
  location: '',
  batchMode: false,

};

function getDefaultWaterInterval(category) {
  if (category === '多肉植物') return 10;
  if (category === '观花植物') return 3;
  if (category === '观叶植物') return 5;
  return 7;

async function renderGarden() {
  const list = $('#garden-list');
  let plants = await dbGetAll(STORE_PLANTS);
  plants = plants.filter(p => !p.isArchived);

  // 搜索
  if (gardenState.search) {
    const q = gardenState.search.toLowerCase();
    plants = plants.filter(p =>
      (p.nickname || '').toLowerCase().includes(q) ||
      (p.species || '').toLowerCase().includes(q)
    );
  }
  // 分类
  if (gardenState.category !== '全部') {
    plants = plants.filter(p => p.plantCategory === gardenState.category);
  }
  // 位置
  if (gardenState.location) {
    plants = plants.filter(p => p.location === gardenState.location);
  }
  // 按种植日期倒序
  plants.sort((a, b) => (b.plantingDate || '').localeCompare(a.plantingDate || ''));

  // 更新位置筛选下拉
  const allLocations = [...new Set((await dbGetAll(STORE_PLANTS)).filter(p=>!p.isArchived).map(p => p.location).filter(Boolean))];
  const locSelect = $('#location-filter');
  locSelect.innerHTML = '<option value="">全部位置</option>' + allLocations.map(l => `<option value="${l}" ${gardenState.location===l?'selected':''}>${l}</option>`).join('');

  // 分类标签
  const cats = ['全部', '多肉植物', '观花植物', '观叶植物', '其他'];
  $('#category-tabs').innerHTML = cats.map(c => {
    const cat = c === '全部' ? null : CATEGORY_MAP[c];
    const iconHTML = cat ? svgIcon(cat.svg, { size: 14, color: 'currentColor' }) : svgIcon('leaf', { size: 14, color: 'currentColor' });
    return `<button class="cat-tab" data-cat="${c}" style="flex-shrink:0;padding:8px 16px;border-radius:20px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.2s;background:${gardenState.category===c?'var(--bean-green)':'var(--milk-tea-light)'};color:${gardenState.category===c?'#fff':'var(--text-sub)'};display:inline-flex;align-items:center;gap:6px;">${iconHTML}${c}</button>`;
  }).join('');
  $$('.cat-tab').forEach(t => t.onclick = () => {
    gardenState.category = t.dataset.cat;
    renderGarden();
  });

  // 渲染列表
  if (plants.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-pot"><div class="empty-leaf"></div></div>
        <p>还没有植物哦，快去添加吧～</p>
      </div>
    `;
  } else {
    list.innerHTML = plants.map(p => {
      const cat = CATEGORY_MAP[p.plantCategory] || CATEGORY_MAP['其他'];
      const days = p.plantingDate ? daysFromNow(p.plantingDate) : 0;
      const statusColor = p.healthStatus === '健康' ? 'var(--bean-green-dark)' : (p.healthStatus === '徒长' || p.healthStatus === '虫害' ? 'var(--warn-red)' : 'var(--warn-yellow)');
      const checked = gardenState.selectedIds.has(p.id);
      return `
        <div class="card" style="display:flex;gap:12px;align-items:center;cursor:pointer;${gardenState.batchMode?'padding-left:8px;':''}" onclick="${gardenState.batchMode ? `toggleBatchSelect('${p.id}')` : `openPlantDetail('${p.id}')`}">
          ${gardenState.batchMode ? `<div style="width:24px;height:24px;border-radius:50%;border:2px solid ${checked?'var(--bean-green-dark)':'var(--milk-tea-dark)'};background:${checked?'var(--bean-green)':'transparent'};display:flex;align-items:center;justify-content:center;flex-shrink:0;">${checked?'<span style="color:#fff;font-size:14px;">✓</span>':''}</div>` : ''}
          <div style="width:64px;height:64px;border-radius:14px;overflow:hidden;flex-shrink:0;background:var(--milk-tea-light);">
            ${imgTag(p.imageList && p.imageList[0], '', 'width:100%;height:100%;object-fit:cover;')}
          </div>
          <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;gap:6px;">
              <span style="font-weight:700;font-size:16px;">${p.nickname}</span>
              <span style="font-size:12px;background:var(--milk-tea-light);padding:2px 6px;border-radius:8px;display:inline-flex;align-items:center;gap:4px;">${svgIcon(cat.svg, {size: 12, color: 'currentColor'})} ${p.plantCategory}</span>
            </div>
            <div style="font-size:12px;color:var(--text-sub);margin-top:2px;">${p.species || '未知品种'}</div>
            <div style="display:flex;align-items:center;gap:8px;margin-top:4px;">
              <div style="width:8px;height:8px;border-radius:50%;background:${statusColor};"></div>
              <span style="font-size:12px;color:var(--text-sub);">相伴 ${days} 天</span>
            </div>
          </div>

      `;

  const batchActive = gardenState.batchMode;

    gardenState.batchMode = !gardenState.batchMode;
    if (!gardenState.batchMode) gardenState.selectedIds.clear();
    renderGarden();
  };
  updateBatchCount();
}

function toggleBatchSelect(id) {
  if (gardenState.selectedIds.has(id)) gardenState.selectedIds.delete(id);
  else gardenState.selectedIds.add(id);

function updateBatchCount() {
  $('#batch-count').textContent = `已选 ${gardenState.selectedIds.size} 棵`;

// 全选
$('#select-all').onclick = async () => {
  let plants = await dbGetAll(STORE_PLANTS);
  plants = plants.filter(p => !p.isArchived);
  // 应用当前筛选
  if (gardenState.search) {
    const q = gardenState.search.toLowerCase();
    plants = plants.filter(p => (p.nickname||'').toLowerCase().includes(q) || (p.species||'').toLowerCase().includes(q));
  }
  if (gardenState.category !== '全部') plants = plants.filter(p => p.plantCategory === gardenState.category);
  if (gardenState.location) plants = plants.filter(p => p.location === gardenState.location);

  if (gardenState.selectedIds.size === plants.length) {
    gardenState.selectedIds.clear();
  } else {
    gardenState.selectedIds = new Set(plants.map(p => p.id));
  }
  renderGarden();
};

// 批量操作
$$('.batch-action').forEach(btn => {
  btn.onclick = async () => {
    if (gardenState.selectedIds.size === 0) {
      showToast('请至少选择一棵植物');
      return;
    }
    const action = btn.dataset.action;
    const actionName = { water: '浇水', pest: '杀虫', repot: '换盆' }[action];
    const count = gardenState.selectedIds.size;
    const confirmed = await showConfirm(
      '批量' + actionName,
      `确定对选中的 ${count} 棵植物进行${actionName}吗？`
    );
    if (!confirmed) return;

    const today = todayStr();
    const ids = Array.from(gardenState.selectedIds);
    for (const id of ids) {
      const p = await dbGet(STORE_PLANTS, id);
      if (!p) continue;
      if (action === 'water') p.lastWateringDate = today;
      else if (action === 'pest') p.lastPestControlDate = today;
      else if (action === 'repot') p.lastRepotDate = today;
      if (!p.operationLog) p.operationLog = [];
      p.operationLog.push(`${today} ${actionName}（批量）`);
      await dbPut(STORE_PLANTS, p);
    }
    showToast(`操作成功 🌱 ${count}棵植物已${actionName}`);
    gardenState.batchMode = false;
    gardenState.selectedIds.clear();
    renderGarden();
  };
});

    $('#plant-save-btn').disabled = !(nickname && species && cat);

  $('#plant-form').plantCategory.addEventListener('change', checkSave);
  checkSave();
}

// 详情页添加/更换照片
window.addDetailPhoto = (plantId) => {
  const input = $('#detail-photo-input');
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    showLoading(true);
    try {
      const compressed = await compressImage(file);
      const p = await dbGet(STORE_PLANTS, plantId);
      if (!p) { showLoading(false); return; }
      if (!p.imageList) p.imageList = [];
      p.imageList.push(compressed.data);
      if (!p.operationLog) p.operationLog = [];
      p.operationLog.push(`${todayStr()} 拍照记录`);
      await dbPut(STORE_PLANTS, p);
      showLoading(false);
      showToast('照片已保存 📷');
      openPlantDetail(plantId); // 刷新详情页
    } catch (err) {
      showLoading(false);
      showToast('照片保存失败，请重试');
    }
    input.value = '';
  };
  input.click();
};

window.toggleTimeline = () => {
  timelineState.expanded = !timelineState.expanded;
  const content = $('#timeline-content');
  if (content) content.style.display = timelineState.expanded ? 'block' : 'none';
  const btn = event.target;
  btn.textContent = timelineState.expanded ? '收起' : '展开';
};

window.toggleComparePhoto = (i) => {
  const el = $('#photo-' + i);
  if (timelineState.compareMode === false) {
    timelineState.compareMode = [i];
    el.style.borderColor = 'var(--bean-green)';
  } else if (timelineState.compareMode.length === 1) {
    if (timelineState.compareMode[0] === i) {
      el.style.borderColor = 'transparent';
      timelineState.compareMode = false;
      return;
    }
    timelineState.compareMode.push(i);
    // 显示对比
    const area = $('#compare-area');
    area.style.display = 'flex';
    const p = window._currentPlantPhotos;
    const photos = window._currentPlantPhotos || [];
    $('#compare-left').innerHTML = imgTag(photos[timelineState.compareMode[0]], '', 'width:100%;height:100%;object-fit:cover;');
    $('#compare-right').innerHTML = imgTag(photos[timelineState.compareMode[1]], '', 'width:100%;height:100%;object-fit:cover;');
  } else {
    // 重置
    $$('#timeline-content > div:first-child > div').forEach(d => d.style.borderColor = 'transparent');
    timelineState.compareMode = false;
    el.style.borderColor = 'var(--bean-green)';
    timelineState.compareMode = [i];
    $('#compare-area').style.display = 'none';
  }
};

window.doPlantAction = async (id, action) => {
  const p = await dbGet(STORE_PLANTS, id);
  if (!p) return;
  const actionName = { water: '浇水', fertilize: '施肥', repot: '换盆', pest: '杀虫' }[action];
  const fieldMap = { water: 'lastWateringDate', fertilize: 'lastFertilizeDate', repot: 'lastRepotDate', pest: 'lastPestControlDate' };
  const lastDate = p[fieldMap[action]];

  // 防误触提醒
  if (action === 'water' && lastDate) {
    const gap = daysFromNow(lastDate);
    if (gap < 1) {
      const confirmed = await showConfirm(
        '温馨提示',
        `距离上次浇水仅${gap === 0 ? '今天' : gap + '天'}，确定要再次浇水吗？`
      );
      if (!confirmed) return;
    }
  } else {
    const confirmed = await showConfirm(
      `${actionName}`,
      `确定要为"${p.nickname}"${actionName}吗？`
    );
    if (!confirmed) return;
  }

  const today = todayStr();
  p[fieldMap[action]] = today;
  if (!p.operationLog) p.operationLog = [];
  p.operationLog.push(`${today} ${actionName}`);
  await dbPut(STORE_PLANTS, p);
  showToast('操作成功 🌱');
  // 刷新详情
  openPlantDetail(id);
};

window.archivePlant = async (id) => {
  const p = await dbGet(STORE_PLANTS, id);
  if (!p) return;
  const reasons = ['浇水过多', '干旱', '虫害', '病害', '冻伤', '晒伤', '自然老化', '其他'];
  const extraHTML = `
    <div style="margin-bottom:12px;text-align:left;">
      <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">死亡原因</label>
      <select id="death-reason" class="select-field" style="width:100%;">
        ${reasons.map(r => `<option value="${r}">${r}</option>`).join('')}
      </select>
    </div>
    <div style="text-align:left;">
      <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">死亡日期</label>
      <input type="date" id="death-date" class="input-field" value="${todayStr()}" style="width:100%;">
    </div>
  `;
  const confirmed = await showConfirm('归档确认', `确认将"${p.nickname}"移入纪念册吗？该操作不可撤销。`, null, extraHTML);
  if (!confirmed) return;
  p.isArchived = true;
  p.deathReason = $('#death-reason').value;
  p.deathDate = $('#death-date').value;
  await dbPut(STORE_PLANTS, p);
  showToast('已归档到纪念册 💐');
  closeOverlay();
};

window.isTipFavorited = async (plantId) => {
  const fav = await dbGetMeta('favorite_tips') || [];
  return fav.includes(plantId);
};

window.toggleFavoriteTip = async (plantId) => {
  let fav = await dbGetMeta('favorite_tips') || [];
  if (fav.includes(plantId)) {
    fav = fav.filter(id => id !== plantId);
    showToast('已取消收藏');
  } else {
    fav.push(plantId);
    showToast('已收藏小贴士 ⭐');
  }
  await dbSetMeta('favorite_tips', fav);
  openPlantDetail(plantId);
};

// ==================== 鲜切花 ====================
async function renderFlowerList() {
  const list = $('#flower-list');
  let flowers = await dbGetAll(STORE_FLOWERS);
  flowers.sort((a, b) => (b.purchaseDate || '').localeCompare(a.purchaseDate || ''));

  if (flowers.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-pot"><div class="empty-leaf" style="background:var(--warn-orange);"></div></div>
        <p>还没有鲜花记录哦～</p>
        <button class="btn" style="margin-top:16px;" onclick="openFlowerForm()">💐 添加鲜花</button>
      </div>
    `;
    return;
  }

  list.innerHTML = `
    <div style="text-align:right;padding:0 16px 12px;">
      <button class="btn btn-sm" onclick="openFlowerForm()">➕ 添加鲜花</button>
    </div>
  ` + flowers.map(f => {
    const days = f.purchaseDate ? daysFromNow(f.purchaseDate) : 0;
    const remaining = (f.estimatedVaseLife || 7) - days;
    let borderColor = 'var(--milk-tea-dark)';
    let statusText = '';
    if (f.isWilted) {
      borderColor = 'var(--text-light)';
      statusText = '<span style="color:var(--text-light);">已凋谢，建议清理</span>';
    } else if (remaining <= 0) {
      borderColor = 'var(--text-light)';
      statusText = '<span style="color:var(--text-light);">已凋谢，建议清理</span>';
    } else if (remaining <= 3) {
      borderColor = 'var(--warn-orange)';
      statusText = `<span style="color:var(--warn-orange);">预计还剩 ${remaining} 天</span>`;
    } else {
      statusText = `<span style="color:var(--bean-green-dark);">预计还剩 ${remaining} 天</span>`;
    }

    const statusMap = {
      '未醒花': '未醒花',
      '醒花中': '醒花中',
      '已醒花': '已醒花',
      '已插瓶': '已插瓶'
    };

    return `
      <div class="card" style="border:2px solid ${borderColor};${f.isWilted?'opacity:0.6;':''}" onclick="openFlowerDetail('${f.id}')">
        <div style="display:flex;gap:12px;align-items:center;">
          <div style="width:56px;height:56px;border-radius:14px;overflow:hidden;flex-shrink:0;background:var(--milk-tea-light);">
            ${f.imageList && f.imageList[0] ? imgTag(f.imageList[0], '', 'width:100%;height:100%;object-fit:cover;') : '<div class="img-placeholder" style="width:100%;height:100%;"></div>'}
          </div>
          <div style="flex:1;min-width:0;">
            <div style="font-weight:700;font-size:16px;">${f.cutFlowerName}</div>
            <div style="font-size:12px;color:var(--text-sub);">${formatDateCN(f.purchaseDate)} · ${statusMap[f.arrivalStatus] || '未醒花'}</div>
            <div style="font-size:12px;margin-top:2px;">${statusText}</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function openFlowerForm(id = null) {

  let imageList = [];

      if (!f) return;
      $('#flower-form').cutFlowerName.value = f.cutFlowerName;
      $('#flower-form').purchaseDate.value = f.purchaseDate || todayStr();
      $('#flower-form').estimatedVaseLife.value = f.estimatedVaseLife || 7;
      $('#flower-form').waterChangeInterval.value = f.waterChangeInterval || 2;
      imageList = f.imageList || [];
      renderFlowerPreview();
    });
  }

  $('#flower-save-btn').onclick = async (e) => {
    e.preventDefault();
    const form = $('#flower-form');
    const name = form.cutFlowerName.value.trim();
    if (!name) { showToast('请填写花名'); return; }
    const data = {
      id: id || ('flower_' + Date.now()),
      cutFlowerName: name,
      purchaseDate: form.purchaseDate.value || todayStr(),
      estimatedVaseLife: parseInt(form.estimatedVaseLife.value) || 7,
      waterChangeInterval: parseInt(form.waterChangeInterval.value) || 2,
      arrivalStatus: '未醒花',
      isWilted: false,
      imageList,
      operationLog: []
    };
    if (id) {
      const old = await dbGet(STORE_FLOWERS, id);
      Object.assign(data, {
        arrivalStatus: old.arrivalStatus,
        isWilted: old.isWilted,
        wiltDate: old.wiltDate,
        lastWaterChangeDate: old.lastWaterChangeDate,
        lastTrimDate: old.lastTrimDate,
        operationLog: old.operationLog || [],
        isExample: old.isExample
      });
    }
    await dbPut(STORE_FLOWERS, data);
    showToast('保存成功 💐');
    closeOverlay();
  };
}

window.startWake = async (id) => {
  const extraHTML = `
    <div style="text-align:left;font-size:13px;line-height:1.8;color:var(--text-main);padding:8px;">
      <b>深水醒花步骤：</b><br>
      1. 花枝斜剪45°<br>
      2. 摘除下部叶片<br>
      3. 放入深水桶（花头勿沾水）<br>
      4. 静置4-6小时<br>
      5. 期间可喷水雾保湿
    </div>
  `;
  const confirmed = await showConfirm('开始醒花', '确认开始醒花流程吗？', null, extraHTML);
  if (!confirmed) return;
  const f = await dbGet(STORE_FLOWERS, id);
  f.arrivalStatus = '醒花中';
  if (!f.operationLog) f.operationLog = [];
  f.operationLog.push(`${todayStr()} 开始醒花`);
  await dbPut(STORE_FLOWERS, f);
  showToast('已开始醒花 🛁');
  openFlowerDetail(id);
};

window.finishWake = async (id) => {
  const f = await dbGet(STORE_FLOWERS, id);
  f.arrivalStatus = '已醒花';
  if (!f.operationLog) f.operationLog = [];
  f.operationLog.push(`${todayStr()} 醒花完成，已插瓶`);
  await dbPut(STORE_FLOWERS, f);
  showToast('醒花完成，可以插瓶啦 🌸');
  openFlowerDetail(id);
};

window.doFlowerAction = async (id, action) => {
  const f = await dbGet(STORE_FLOWERS, id);
  if (!f) return;
  const actionName = { water: '换水', trim: '剪根' }[action];
  const confirmed = await showConfirm(actionName, `确定要为"${f.cutFlowerName}"${actionName}吗？`);
  if (!confirmed) return;
  const today = todayStr();
  if (action === 'water') f.lastWaterChangeDate = today;
  else if (action === 'trim') f.lastTrimDate = today;
  if (!f.operationLog) f.operationLog = [];
  f.operationLog.push(`${today} ${actionName}`);
  await dbPut(STORE_FLOWERS, f);
  showToast(`操作成功 ${action === 'water' ? '💧' : '✂️'}`);
  openFlowerDetail(id);
};

window.markWilted = async (id) => {
  const f = await dbGet(STORE_FLOWERS, id);
  const confirmed = await showConfirm('凋谢确认', `确认"${f.cutFlowerName}"已经凋谢了吗？`);
  if (!confirmed) return;
  f.isWilted = true;
  f.wiltDate = todayStr();
  if (!f.operationLog) f.operationLog = [];
  f.operationLog.push(`${todayStr()} 凋谢`);
  await dbPut(STORE_FLOWERS, f);
  showToast('已记录凋谢 💐');
  openFlowerDetail(id);
};

// ==================== 养护小贴士 ====================
function getTipsForCategory(category) {
  const common = [
    '通风差，浇水后开窗或风扇吹1小时',
    '多肉易徒长，每3天转动花盆180°'
  ];
  const shaanxi = [
    '春秋干燥，观叶植物需叶面喷水',
    '冬季供暖温度高，浇水增加30%'
  ];
  if (category === '多肉植物') {
    return [...common, ...shaanxi, '夏季＞35℃控水至15-20天，傍晚浇', '冬季＜5℃断水'];
  }
  if (category === '观花植物') {
    return [...common, ...shaanxi, '月季易红蜘蛛，每周检查叶背', '喷牛奶水（1:10）防治红蜘蛛'];
  }
  if (category === '观叶植物') {
    return [...common, ...shaanxi];
  }
  return [...common, ...shaanxi];
}

// ==================== 数据导出导入 ====================
window.exportData = async () => {
  showLoading(true);
  try {
    const plants = await dbGetAll(STORE_PLANTS);
    const flowers = await dbGetAll(STORE_FLOWERS);
    const meta = {};
    const metaKeys = ['favorite_tips'];
    for (const k of metaKeys) {
      meta[k] = await dbGetMeta(k);
    }
    const data = {
      version: 1,
      exportDate: todayStr(),
      plants,
      flowers,
      meta
    };
    const json = JSON.stringify(data);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `植间日记_备份_${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('导出成功，请妥善保管 📁');
  } catch (err) {
    console.error(err);
    showToast('导出失败');
  }
  showLoading(false);
};

window.importData = async (event) => {
  const file = event.target.files[0];
  if (!file) return;
  event.target.value = '';
  const confirmed = await showConfirm('导入确认', '导入将覆盖当前所有数据，是否继续？');
  if (!confirmed) return;
  showLoading(true);
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data.plants || !data.flowers) throw new Error('invalid');
    // 清空
    const oldPlants = await dbGetAll(STORE_PLANTS);
    const oldFlowers = await dbGetAll(STORE_FLOWERS);
    for (const p of oldPlants) await dbDelete(STORE_PLANTS, p.id);
    for (const f of oldFlowers) await dbDelete(STORE_FLOWERS, f.id);
    // 导入
    for (const p of data.plants) await dbPut(STORE_PLANTS, p);
    for (const f of data.flowers) await dbPut(STORE_FLOWERS, f);
    if (data.meta) {
      for (const [k, v] of Object.entries(data.meta)) {
        if (v !== null) await dbSetMeta(k, v);
      }
    }
    showToast('导入成功 🎉');
    showLoading(false);
    closeOverlay();
    renderMe();
    renderHome();
  } catch (err) {
    console.error(err);
    showLoading(false);
    showToast('导入失败，文件格式不正确');
  }
};

// ==================== 初始化 ====================

  try {
    await openDB();
    await initSampleData();
  } catch (err) {
    console.error('初始化失败', err);
  }

  // Tab 切换
  $$('.tab-item').forEach(tab => {
    tab.onclick = () => switchPage(tab.dataset.page);
  });

  // 默认渲染首页
  renderHome();

  // 页面获得焦点时刷新首页待办
  window.addEventListener('focus', () => {
    if (currentPage === 'home') renderHome();
  });

  // 注册 Service Worker（PWA离线缓存）— 由于是单文件，这里用内联方式跳过 SW 注册

}
