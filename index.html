<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="植间日记">
  <meta name="theme-color" content="#F7F9F6">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%23F7F9F6'/%3E%3Cpath d='M176 336 L336 336 L320 424 C317 446 195 446 192 424 Z' fill='%23A8C3A6' stroke='%235F8A5F' stroke-width='8' stroke-linejoin='round'/%3E%3Crect x='158' y='318' width='196' height='26' rx='13' fill='%23A8C3A6' stroke='%235F8A5F' stroke-width='8'/%3E%3Cpath d='M256 330 Q250 250 252 190' stroke='%235F8A5F' stroke-width='9' fill='none' stroke-linecap='round'/%3E%3Cpath d='M253 280 C210 250 190 200 196 166 C230 165 258 210 253 280 Z' fill='%23A8C3A6' stroke='%235F8A5F' stroke-width='6' stroke-linejoin='round'/%3E%3Cpath d='M259 300 C305 268 330 218 322 184 C288 184 262 230 259 300 Z' fill='%23A8C3A6' stroke='%235F8A5F' stroke-width='6' stroke-linejoin='round'/%3E%3Cpath d='M252 200 C240 176 244 150 262 132 C278 150 270 176 258 200 Z' fill='%238FBC8F' stroke='%235F8A5F' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
  <title>植间日记</title>
  <style>
    /* ====== 全局变量与基础样式 ====== */
    :root {
      --milk-tea: #F7F9F6;
      --milk-tea-light: #E8F0E6;
      --milk-tea-dark: #EFEFEF;
      --bean-green: #A8C3A6;
      --bean-green-dark: #8FBC8F;
      --bean-green-light: #C8DBC6;
      --accent: #8BC34A;
      --accent-dark: #7CB342;
      --text-main: #3D3D3D;
      --text-sub: #999999;
      --text-light: #BDBDBD;
      --warn-orange: #E8A87C;
      --warn-red: #E07A5F;
      --warn-yellow: #F2CC8F;
      --card-bg: #FFFFFF;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
      --radius: 20px;
      --radius-sm: 12px;
      --tab-height: 70px;
      /* 页面主题色（默认=首页） */
      --page-nav: #8DB5D6;
      --page-nav-dark: #7BA7C9;
      --page-accent: #8DB5D6;
      --page-card: #F0F6FA;
      --page-soft: #E3EEF5;
      --page-deep: #8DB5D6;
    }

    /* ====== 各页面主题色（差异化配色，仅花园用绿色系） ====== */
    body[data-page="home"] {
      --page-nav: #8DB5D6; --page-nav-dark: #7BA7C9;
      --page-accent: #8DB5D6; --page-card: #F0F6FA;
      --page-soft: #E3EEF5; --page-deep: #8DB5D6;
    }
    body[data-page="garden"] {
      --page-nav: #9BBF8F; --page-nav-dark: #84AC77;
      --page-accent: #9BBF8F; --page-card: #F3F8F1;
      --page-soft: #E6F0E3; --page-deep: #9BBF8F;
    }
    body[data-page="flower"] {
      --page-nav: #F2C6B6; --page-nav-dark: #E8AE99;
      --page-accent: #F2C6B6; --page-card: #FFF7F5;
      --page-soft: #FCE9E3; --page-deep: #F2C6B6;
    }
    body[data-page="calendar"] {
      --page-nav: #E8D4A8; --page-nav-dark: #D8BF8C;
      --page-accent: #E8D4A8; --page-card: #FAF9F4;
      --page-soft: #F2EDDC; --page-deep: #E8D4A8;
    }
    body[data-page="me"] {
      --page-nav: #C4B5D4; --page-nav-dark: #AC98C2;
      --page-accent: #C4B5D4; --page-card: #FFFFFF;
      --page-soft: #EBE4F2; --page-deep: #C4B5D4;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    button, [onclick], .card[style*="cursor:pointer"], .card {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:active, [onclick]:active {
      opacity: 0.75;
      transform: scale(0.97);
      transition: transform 0.1s, opacity 0.1s;
    }
    .card:active {
      background: var(--page-soft);
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, ".SF NS Rounded", "PingFang SC", "Helvetica Neue", sans-serif;
      background: var(--milk-tea);
      color: var(--text-main);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      padding-bottom: env(safe-area-inset-bottom);
      padding-bottom: constant(safe-area-inset-bottom);
    }
    input, textarea {
      user-select: text;
      -webkit-user-select: text;
    }

    #app {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ====== 页面容器 ====== */
    .page {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: none;
      flex-direction: column;
    }
    .page.active {
      display: flex;
    }

    /* ====== 顶部标题栏 ====== */
    .page-header {
      background: var(--page-nav);
      padding: 0;
      padding-top: env(safe-area-inset-top, 0px);
      padding-top: constant(safe-area-inset-top, 0px);
      height: calc(env(safe-area-inset-top, 0px) + 54px);
      height: calc(constant(safe-area-inset-top, 0px) + 54px);
      position: sticky;
      top: 0;
      z-index: 10;
      transition: background 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-bottom: 20px;
    }
    .page-title {
      font-size: 18px;
      font-weight: 700;
      color: #FFFFFF;
      text-align: center;
      letter-spacing: 1px;
    }
    .page-subtitle {
      display: none;
    }

    /* ====== 底部 Tab 栏 ====== */
    .tab-bar {
      min-height: var(--tab-height);
      background: #FFFFFF;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      border-top: 1px solid #EFEFEF;
      position: relative;
      z-index: 20;
      padding-bottom: constant(safe-area-inset-bottom, 24px);
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }
    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #BDBDBD;
      cursor: pointer;
      transition: color 0.2s;
      min-height: 44px;
      padding-top: 8px;
    }
    .tab-item svg {
      width: 30px;
      height: 30px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tab-item span {
      font-size: 11px;
      font-weight: 700;
    }
    .tab-item.active {
      color: var(--page-accent);
    }
    .tab-item.active svg {
      fill: color-mix(in srgb, var(--page-accent) 25%, transparent);
      stroke: var(--page-accent);
    }

    /* ====== 卡片通用样式 ====== */
    .card {
      background: var(--page-card, var(--card-bg));
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 16px;
      margin: 0 16px 14px;
      transition: background 0.3s;
    }

    /* ====== 按钮 ====== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 22px;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      background: var(--page-accent, var(--accent));
      color: #fff;
      font-family: inherit;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.4; }
    .btn-secondary {
      background: var(--page-soft);
      color: var(--text-main);
    }
    .btn-outline {
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent-dark);
    }
    .btn-danger {
      background: var(--warn-red);
    }
    .btn-sm {
      padding: 8px 14px;
      font-size: 13px;
    }
    .btn-block {
      width: 100%;
      display: flex;
    }

    /* ====== 输入框 ====== */
    .input-group {
      margin-bottom: 14px;
    }
    .input-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 6px;
      display: block;
    }
    .input-field, .textarea-field, .select-field {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--milk-tea-dark);
      border-radius: var(--radius-sm);
      font-size: 15px;
      background: var(--page-soft);
      color: var(--text-main);
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .input-field:focus, .textarea-field:focus, .select-field:focus {
      outline: none;
      border-color: var(--page-deep);
      background: #fff;
    }
    .textarea-field {
      resize: none;
      min-height: 70px;
    }
    .required-mark {
      color: var(--warn-red);
      margin-left: 2px;
    }
    .input-hint {
      font-size: 11px;
      color: var(--text-light);
      margin-top: 4px;
      line-height: 1.4;
    }

    /* ====== Toast ====== */
    #toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(90, 74, 58, 0.92);
      color: #fff;
      padding: 14px 24px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      max-width: 80%;
      text-align: center;
    }
    #toast.show {
      opacity: 1;
    }

    /* ====== Modal ====== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(90, 74, 58, 0.5);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal-box {
      background: #fff;
      border-radius: var(--radius);
      padding: 24px;
      max-width: 340px;
      width: 100%;
      box-shadow: var(--shadow);
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 12px;
    }
    .modal-text {
      font-size: 14px;
      color: var(--text-sub);
      text-align: center;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .modal-actions {
      display: flex;
      gap: 12px;
    }
    .modal-actions .btn {
      flex: 1;
    }

    /* ====== 空状态 ====== */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--text-light);
    }
    .empty-pot {
      width: 100px;
      height: 110px;
      margin-bottom: 16px;
      position: relative;
    }
    .empty-pot::before {
      content: '';
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 45px;
      background: var(--milk-tea-dark);
      border-radius: 6px 6px 30px 30px / 6px 6px 45px 45px;
    }
    .empty-pot::after {
      content: '';
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 14px;
      background: var(--milk-tea-dark);
      border-radius: 50%;
    }
    .empty-leaf {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 55px;
      background: var(--page-soft);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    }
    .empty-state p {
      font-size: 14px;
      text-align: center;
    }

    /* ====== 加载遮罩 ====== */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(245, 230, 211, 0.9);
      z-index: 5000;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    #loading-overlay.show {
      display: flex;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--milk-tea-dark);
      border-top-color: var(--page-deep);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .img-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--milk-tea-dark), var(--page-soft));
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .img-placeholder::after {
      content: '🌱';
      font-size: 28px;
      opacity: 0.8;
    }
    .ico {
      display: inline-block;
      vertical-align: middle;
      width: 1.2em;
      height: 1.2em;
    }

    /* overlay页面统一头部 */
    .overlay-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--page-nav, var(--page-deep));
      padding: 10px 16px;
      z-index: 5;
      margin: 0 -16px 16px;
      transition: background 0.3s;
    }
    .overlay-header .back-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      padding: 0;
    }
    .overlay-header .header-title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }
    .overlay-header .header-right {
      min-width: 44px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .overlay-header .header-right button {
      background: none;
      border: none;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
      font-family: inherit;
      padding: 8px;
    }

    /* 日历格子样式 */
    .cal-day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 14px;
      position: relative;
    }
    .cal-day.has-log {
      font-weight: 600;
      cursor: pointer;
    }
    .cal-day.today {
      background: var(--page-soft);
    }
    .cal-day.today span {
      color: var(--page-deep);
      font-weight: 700;
    }
    .cal-dot {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    /* ====== 照片浏览器 ====== */
    .photo-viewer {
      position: fixed; inset: 0; background: rgba(0,0,0,0.92);
      z-index: 9000; display: none; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .photo-viewer.show { display: flex; }
    .photo-viewer img {
      max-width: 92%; max-height: 80vh; border-radius: 12px;
      object-fit: contain;
    }
    .photo-viewer-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 20px 16px env(safe-area-inset-bottom, 20px);
      display: flex; gap: 12px; justify-content: center;
    }
    .photo-viewer-bar button {
      background: rgba(255,255,255,0.2); color: #fff; border: none;
      border-radius: 20px; padding: 10px 18px; font-size: 14px;
      cursor: pointer; font-weight: 600;
    }
    .photo-viewer-close {
      position: absolute; top: 16px; right: 16px;
      background: rgba(255,255,255,0.2); color: #fff; border: none;
      border-radius: 50%; width: 36px; height: 36px; font-size: 18px;
      cursor: pointer;
    }
    .photo-viewer-counter {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      color: #fff; font-size: 14px; font-weight: 600;
    }

    /* ====== 庆祝动画 ====== */
    .celebrate-overlay {
      position: fixed; inset: 0; z-index: 9500;
      pointer-events: none; display: flex; align-items: center;
      justify-content: center;
    }
    .celebrate-emoji {
      font-size: 64px; animation: celebrateBounce 0.8s ease-out forwards;
    }
    @keyframes celebrateBounce {
      0% { transform: scale(0) rotate(0deg); opacity: 0; }
      50% { transform: scale(1.3) rotate(180deg); opacity: 1; }
      100% { transform: scale(1) rotate(360deg); opacity: 0; }
    }

    /* ====== 图表条 ====== */
    .stat-bar-row {
      margin-bottom: 14px;
    }
    .stat-bar-track {
      height: 10px; background: var(--page-soft);
      border-radius: 5px; overflow: hidden; margin-top: 6px;
    }
    .stat-bar-fill {
      height: 100%; border-radius: 5px;
      transition: width 0.5s ease-out;
    }

    /* ====== 搜索历史 ====== */
    .search-history {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
    }
    .search-history-tag {
      padding: 4px 12px; border-radius: 16px;
      background: var(--page-soft); font-size: 12px;
      color: var(--text-sub); cursor: pointer;
    }

    /* ====== 知识库 ====== */
    .knowledge-item {
      padding: 14px; border-radius: 12px;
      background: var(--page-soft); margin-bottom: 10px;
    }
    .knowledge-item h4 {
      font-size: 15px; font-weight: 700; margin-bottom: 6px;
    }
    .knowledge-item p {
      font-size: 13px; color: var(--text-sub); line-height: 1.6;
    }

    /* ====== 滑动操作指示 ====== */
    .swipe-hint {
      position: absolute; right: 0; top: 0; bottom: 0;
      width: 0; overflow: hidden; transition: width 0.3s;
      display: flex; align-items: center; justify-content: center;
      background: var(--page-accent, var(--accent));
      color: #fff; font-size: 13px; font-weight: 600;
      border-radius: 0 var(--radius) var(--radius) 0;
    }

    /* ====== 回到顶部按钮 ====== */
    .scroll-top-btn {
      position: fixed; bottom: calc(var(--tab-height) + 80px + env(safe-area-inset-bottom));
      right: 16px; width: 44px; height: 44px; border-radius: 50%;
      background: var(--page-nav, var(--page-deep)); color: #fff;
      border: none; font-size: 20px; cursor: pointer;
      box-shadow: var(--shadow); z-index: 50;
      display: none; align-items: center; justify-content: center;
      transition: opacity 0.3s;
    }
    .scroll-top-btn.show { display: flex; }
  </style>
</head>
<body>
<div id="app">
  <!-- ============ 首页 ============ -->
  <div class="page active" id="page-home">
    <div class="page-header">
      <div class="page-title">植间日记</div>
      <div class="page-subtitle">让每一片叶子都有故事</div>
    </div>
    <div id="home-content" style="padding-bottom:20px;"></div>
  </div>

  <!-- ============ 花园 ============ -->
  <div class="page" id="page-garden">
    <div class="page-header">
      <div class="page-title">我的花园</div>
    </div>
    <div style="padding: 0 16px 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 40px); background: var(--milk-tea); z-index: 9;">
      <div style="position: relative; margin-bottom: 10px;">
        <input type="text" id="search-input" class="input-field" placeholder="搜索植物昵称或品种..." style="padding-left:36px;">
        <svg style="position:absolute;left:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--text-light);fill:none;stroke-width:2;" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <button id="search-clear" style="display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;color:var(--text-light);cursor:pointer;">✕</button>
      </div>
      <div id="category-tabs" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">
        <select id="location-filter" class="select-field" style="width:auto;padding:8px 12px;font-size:13px;">
          <option value="">全部位置</option>
        </select>
        <button id="batch-toggle" class="btn btn-secondary btn-sm">批量管理</button>
      </div>
    </div>
    <div id="garden-list" style="padding-bottom: 80px;"></div>
    <div id="batch-bar" style="display:none;position:fixed;bottom:calc(var(--tab-height) + env(safe-area-inset-bottom));left:0;right:0;background:#fff;border-top:1px solid #EFEFEF;padding:12px 16px;z-index:15;">

/* ============================================================
 * 植间日记 - PWA 植物养护应用
 * 单页 HTML，IndexedDB 存储，北京时间计算
 * ============================================================ */

// ==================== 全局工具 ====================
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));

const TZ_OFFSET = 8 * 60 * 60 * 1000;
function nowInBeijing() {
  const now = new Date();
  const utc = now.getTime() + now.getTimezoneOffset() * 60000;
  return new Date(utc + TZ_OFFSET);
}
function todayStr() {
  const d = nowInBeijing();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function formatDateCN(dateStr, withYear = true) {
  if (!dateStr) return '';
  const d = new Date(dateStr + (dateStr.length === 10 ? 'T00:00:00+08:00' : ''));
  if (isNaN(d.getTime())) return dateStr;
  const bj = new Date(d.getTime() + (d.getTimezoneOffset() * 60000) + TZ_OFFSET);
  const m = bj.getMonth() + 1;
  const day = bj.getDate();
  if (withYear) {
    return `${bj.getFullYear()}年${m}月${day}日`;
  }
  return `${m}月${day}日`;
}
function daysBetween(dateStr1, dateStr2) {
  if (!dateStr1 || !dateStr2) return 0;
  const d1 = new Date(dateStr1 + 'T00:00:00');
  const d2 = new Date(dateStr2 + 'T00:00:00');
  return Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
}
function daysFromNow(dateStr) {
  if (!dateStr) return null;
  return daysBetween(dateStr, todayStr());
}

function showToast(msg, duration = 2000) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), duration);
}

// 滑动手势绑定（左滑操作+右滑浇水）
function bindSwipe(el, opts = {}) {
  const onSwipeLeft = opts.onSwipeLeft;
  const onSwipeRight = opts.onSwipeRight;
  let startX = 0, startY = 0, currentX = 0, isSwiping = false;
  const threshold = 60;

  el.style.position = 'relative';
  el.style.overflow = 'hidden';

  if (onSwipeLeft) {
    const hint = document.createElement('div');
    hint.className = 'swipe-hint';
    hint.textContent = opts.leftText || '操作';
    el.appendChild(hint);
    el._swipeHint = hint;
  }
  if (onSwipeRight) {
    const hintR = document.createElement('div');
    hintR.className = 'swipe-hint';
    hintR.style.left = '0';
    hintR.style.right = 'auto';
    hintR.style.borderRadius = 'var(--radius) 0 0 var(--radius)';
    hintR.style.background = '#4A90D9';
    hintR.textContent = opts.rightText || '浇水';
    el._swipeHintR = hintR;
  }

  el.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    isSwiping = false;
  }, { passive: true });

  el.addEventListener('touchmove', (e) => {
    currentX = e.touches[0].clientX;
    const currentY = e.touches[0].clientY;
    const dx = currentX - startX;
    const dy = currentY - startY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
      isSwiping = true;
      if (dx < 0 && el._swipeHint) {
        el._swipeHint.style.width = Math.min(80, Math.abs(dx)) + 'px';
      } else if (dx > 0 && el._swipeHintR) {
        el._swipeHintR.style.width = Math.min(80, dx) + 'px';
      }
    }
  }, { passive: true });

  el.addEventListener('touchend', () => {
    const dx = currentX - startX;
    if (isSwiping) {
      if (dx < -threshold && onSwipeLeft) onSwipeLeft();
      else if (dx > threshold && onSwipeRight) onSwipeRight();
    }
    if (el._swipeHint) el._swipeHint.style.width = '0';
    if (el._swipeHintR) el._swipeHintR.style.width = '0';
    isSwiping = false;
  });
}
window.bindSwipe = bindSwipe;

  el.addEventListener('touchstart', (e) => {

      e.preventDefault();

// ==================== IndexedDB ====================
const DB_NAME = 'PlantDiaryDB';
const DB_VERSION = 1;
const STORE_PLANTS = 'plants';
const STORE_FLOWERS = 'flowers';
const STORE_META = 'meta';

let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE_PLANTS)) {
        d.createObjectStore(STORE_PLANTS, { keyPath: 'id' });
      }
      if (!d.objectStoreNames.contains(STORE_FLOWERS)) {
        d.createObjectStore(STORE_FLOWERS, { keyPath: 'id' });
      }
      if (!d.objectStoreNames.contains(STORE_META)) {
        d.createObjectStore(STORE_META, { keyPath: 'key' });
      }
    };
  });
}

function dbGetAll(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

function dbGet(store, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbPut(store, obj) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).put(obj);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbDelete(store, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function dbGetMeta(key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_META, 'readonly');
    const req = tx.objectStore(STORE_META).get(key);
    req.onsuccess = () => resolve(req.result ? req.result.value : null);
    req.onerror = () => reject(req.error);
  });
}

function dbSetMeta(key, value) {
  return dbPut(STORE_META, { key, value });
}

// ==================== 图片处理 ====================
function compressImage(file, maxWidth = 720, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxWidth) {
          height = Math.round(height * maxWidth / width);
          width = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve({
          data: canvas.toDataURL('image/jpeg', quality),
          width, height
        });
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function imgTag(base64, cls = '', style = '') {
  if (!base64) {
    return `<div class="img-placeholder ${cls}" style="${style}"></div>`;
  }
  return `<img src="${base64}" class="${cls}" style="${style}" onerror="this.outerHTML='<div class=&quot;img-placeholder&quot;></div>';">`;
}

// ==================== 花园列表 ====================
let gardenState = {
  search: '',
  category: '全部',
  location: '',
  batchMode: false,
  selectedIds: new Set()
};

function getDefaultWaterInterval(category) {
  if (category === '多肉植物') return 10;
  if (category === '观花植物') return 3;
  if (category === '观叶植物') return 5;
  return 7;
}

async function renderGarden() {
  const list = $('#garden-list');
  let plants = await dbGetAll(STORE_PLANTS);
  plants = plants.filter(p => !p.isArchived);

  if (gardenState.search) {
    const q = gardenState.search.toLowerCase();
    plants = plants.filter(p =>
      (p.nickname || '').toLowerCase().includes(q) ||
      (p.species || '').toLowerCase().includes(q)
    );
  }
  if (gardenState.category !== '全部') {
    plants = plants.filter(p => p.plantCategory === gardenState.category);
  }
  if (gardenState.location) {
    plants = plants.filter(p => p.location === gardenState.location);
  }
  plants.sort((a, b) => (b.plantingDate || '').localeCompare(a.plantingDate || ''));

  const allLocations = [...new Set((await dbGetAll(STORE_PLANTS)).filter(p=>!p.isArchived).map(p => p.location).filter(Boolean))];
  const locSelect = $('#location-filter');
  locSelect.innerHTML = '<option value="">全部位置</option>' + allLocations.map(l => `<option value="${l}" ${gardenState.location===l?'selected':''}>${l}</option>`).join('');

  const cats = ['全部', '多肉植物', '观花植物', '观叶植物', '其他'];
  $('#category-tabs').innerHTML = cats.map(c => {
    const cat = c === '全部' ? null : CATEGORY_MAP[c];
    const iconHTML = cat ? svgIcon(cat.svg, { size: 14, color: 'currentColor' }) : svgIcon('leaf', { size: 14, color: 'currentColor' });
    return `<button class="cat-tab" data-cat="${c}" style="flex-shrink:0;padding:8px 16px;border-radius:20px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.2s;background:${gardenState.category===c?'var(--page-deep)':'var(--page-soft)'};color:${gardenState.category===c?'#fff':'var(--text-sub)'};display:inline-flex;align-items:center;gap:6px;">${iconHTML}${c}</button>`;
  }).join('');
  $$('.cat-tab').forEach(t => t.onclick = () => {
    gardenState.category = t.dataset.cat;
    renderGarden();
  });

  if (plants.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-pot"><div class="empty-leaf"></div></div>
        <p>还没有植物哦，快去添加吧～</p>
      </div>
    `;
  } else {
    list.innerHTML = plants.map(p => {
      const cat = CATEGORY_MAP[p.plantCategory] || CATEGORY_MAP['其他'];
      const days = p.plantingDate ? daysFromNow(p.plantingDate) : 0;
      const statusColor = p.healthStatus === '健康' ? 'var(--page-deep)' : (p.healthStatus === '徒长' || p.healthStatus === '虫害' ? 'var(--warn-red)' : 'var(--warn-yellow)');
      const checked = gardenState.selectedIds.has(p.id);
      return `
        <div class="garden-plant-card" data-plant-id="${p.id}" style="margin:0 16px 10px;">
          <div class="card" style="display:flex;gap:12px;align-items:center;cursor:pointer;${gardenState.batchMode?'padding-left:8px;':''}" onclick="${gardenState.batchMode ? `toggleBatchSelect('${p.id}')` : `openPlantDetail('${p.id}')`}">
            ${gardenState.batchMode ? `<div style="width:24px;height:24px;border-radius:50%;border:2px solid ${checked?'var(--page-deep)':'var(--milk-tea-dark)'};background:${checked?'var(--page-deep)':'transparent'};display:flex;align-items:center;justify-content:center;flex-shrink:0;">${checked?'<span style="color:#fff;font-size:14px;">✓</span>':''}</div>` : ''}
            <div style="width:64px;height:64px;border-radius:14px;overflow:hidden;flex-shrink:0;background:var(--page-soft);">
              ${imgTag(p.imageList && p.imageList[0], '', 'width:100%;height:100%;object-fit:cover;')}
            </div>
            <div style="flex:1;min-width:0;">
              <div style="display:flex;align-items:center;gap:6px;">
                <span style="font-weight:700;font-size:16px;">${p.nickname}</span>
                <span style="font-size:12px;background:var(--page-soft);padding:2px 6px;border-radius:8px;display:inline-flex;align-items:center;gap:4px;">${svgIcon(cat.svg, {size: 12, color: 'currentColor'})} ${p.plantCategory}</span>
              </div>
              <div style="font-size:12px;color:var(--text-sub);margin-top:2px;">${p.species || '未知品种'}</div>
              <div style="display:flex;align-items:center;gap:8px;margin-top:4px;">
                <div style="width:8px;height:8px;border-radius:50%;background:${statusColor};"></div>
                <span style="font-size:12px;color:var(--text-sub);">相伴 ${days} 天</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');

    // 绑定长按删除 + 右滑浇水（非批量模式）
    if (!gardenState.batchMode) {
      $$('.garden-plant-card', list).forEach(el => {
        const pid = el.dataset.plantId;
        bindLongPress(el, async () => {
          const p = await dbGet(STORE_PLANTS, pid);
          if (!p) return;
          el.style.background = 'var(--milk-tea-dark)';
          setTimeout(() => el.style.background = '', 300);
          const ok = await showConfirm('删除植物', `确定要永久删除「${p.nickname}」吗？此操作不可恢复。`);
          if (ok) {
            await dbDelete(STORE_PLANTS, pid);
            showToast(`已删除「${p.nickname}」`);
            renderGarden();
          }
        });
        // 右滑浇水
        bindSwipe(el, {
          onSwipeRight: async () => {
            const p = await dbGet(STORE_PLANTS, pid);
            if (!p || p.isArchived) return;
            const confirmed = await showConfirm('浇水', `确定为"${p.nickname}"浇水吗？`);
            if (confirmed) {
              p.lastWateringDate = todayStr();
              if (!p.operationLog) p.operationLog = [];
              p.operationLog.push(`${todayStr()} 浇水`);
              await dbPut(STORE_PLANTS, p);
              showToast('浇水成功 💧');
              celebrate('💧');
              renderGarden();
            }
          },
          rightText: '💧浇水'
        });
      });
    }
  }

  const batchActive = gardenState.batchMode;
  $('#batch-bar').style.display = batchActive ? 'block' : 'none';
  $('#garden-list').style.paddingBottom = batchActive ? '160px' : '80px';
  $('#batch-toggle').textContent = batchActive ? '退出批量' : '批量管理';
  $('#batch-toggle').onclick = () => {
    gardenState.batchMode = !gardenState.batchMode;
    if (!gardenState.batchMode) gardenState.selectedIds.clear();
    renderGarden();
  };
  updateBatchCount();
}

function updateBatchCount() {
  $('#batch-count').textContent = `已选 ${gardenState.selectedIds.size} 棵`;

async function saveSearchHistory(term) {
  if (!term) return;
  let history = await dbGetMeta('search_history') || [];
  history = history.filter(h => h !== term);
  history.unshift(term);
  history = history.slice(0, 8);
  await dbSetMeta('search_history', history);
}

$('#select-all').onclick = async () => {

// ==================== 批量操作（六按钮） ====================
async function handleBatchAction(action) {
  if (gardenState.selectedIds.size === 0) {
    showToast('请至少选择一棵植物');
    return;
  }
  const count = gardenState.selectedIds.size;
  const ids = Array.from(gardenState.selectedIds);
  const today = todayStr();

  if (action === 'delete') {
    const ok = await showConfirm('批量删除', `确定要永久删除选中的 ${count} 棵植物吗？此操作不可恢复。`);
    if (!ok) return;
    for (const id of ids) await dbDelete(STORE_PLANTS, id);
    showToast(`已删除 ${count} 棵植物`);
    gardenState.batchMode = false;
    gardenState.selectedIds.clear();
    renderGarden();
    return;
  }

  if (action === 'archive') {
    const ok = await showConfirm('批量归档', `确定要将选中的 ${count} 棵植物归档到纪念册吗？`);
    if (!ok) return;
    for (const id of ids) {
      const p = await dbGet(STORE_PLANTS, id);
      if (!p) continue;
      p.isArchived = true;
      p.deathDate = today;
      await dbPut(STORE_PLANTS, p);
    }
    showToast(`已归档 ${count} 棵植物到纪念册`);
    gardenState.batchMode = false;
    gardenState.selectedIds.clear();
    renderGarden();
    return;
  }

  const actionName = { water: '浇水', fertilize: '施肥', repot: '换盆', pest: '杀虫' }[action];
  const fieldMap = { water: 'lastWateringDate', fertilize: 'lastFertilizeDate', repot: 'lastRepotDate', pest: 'lastPestControlDate' };
  const ok = await showConfirm('批量' + actionName, `确定对选中的 ${count} 棵植物进行${actionName}吗？`);
  if (!ok) return;

  const snapshot = [];
  for (const id of ids) {
    const p = await dbGet(STORE_PLANTS, id);
    if (!p) continue;
    snapshot.push({ id, oldDate: p[fieldMap[action]] || '' });
    p[fieldMap[action]] = today;
    if (!p.operationLog) p.operationLog = [];
    p.operationLog.push(`${today} ${actionName}（批量）`);
    await dbPut(STORE_PLANTS, p);
  }
  gardenState.batchMode = false;
  gardenState.selectedIds.clear();
  window._batchSnapshot = { actionName, fieldMap: fieldMap[action], today, snapshot };

  const undoHTML = `<div style="margin-top:12px;"><button onclick="undoBatchAction('${actionName}')" class="btn btn-secondary btn-sm" style="width:100%;color:var(--text-main);">撤销本次批量${actionName}操作</button></div>`;
  renderGarden();
  await showConfirm('操作成功', `已对 ${snapshot.length} 棵植物完成${actionName}。`, null, undoHTML);
}

// 批量操作事件委托（在init中绑定）
function bindBatchActions() {
  $('#batch-actions').addEventListener('click', (e) => {
    const btn = e.target.closest('.batch-action');
    if (!btn) return;
    handleBatchAction(btn.dataset.action);
  });
}

// 批量操作撤销
window.undoBatchAction = async (actionName) => {
  const snap = window._batchSnapshot;
  if (!snap || snap.actionName !== actionName) return;
  const { fieldMap, today, snapshot } = snap;

  const confirmed = await showConfirm('撤销批量操作', `确定要撤回对 ${snapshot.length} 棵植物的批量${actionName}操作吗？`);
  if (!confirmed) return;

  for (const s of snapshot) {
    const p = await dbGet(STORE_PLANTS, s.id);
    if (!p) continue;
    if (p.operationLog) {
      p.operationLog = p.operationLog.filter(l => !(l.includes(`${today} ${actionName}（批量）`)));
    }
    p[fieldMap] = s.oldDate;
    await dbPut(STORE_PLANTS, p);
  }

  window._batchSnapshot = null;
  showToast(`已撤销批量${actionName}操作，共 ${snapshot.length} 棵植物`);
  if (currentPage === 'garden') renderGarden();
};

      </div>
    `).join('');

  window.removeFormPhoto = (i) => {
    imageList.splice(i, 1);
    renderPhotoPreview(imageList);
  };

  $('#plant-photo-input').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    for (const f of files) {
      try {
        const result = await compressImage(f);
        imageList.push(result.data);
      } catch (err) {
        console.error('图片处理失败', err);
      }
    }
    e.target.value = '';
    renderPhotoPreview(imageList);
  });

  // 类别联动
  $('#plant-form').plantCategory.addEventListener('change', () => {
    const form = $('#plant-form');
    const link = CATEGORY_LINK[form.plantCategory.value];
    if (link) {
      form.waterDemand.value = link.waterDemand;
      form.lightPreference.value = link.lightPreference;
    }
  });

  // 位置联动
  $('#plant-form').locationPreset.addEventListener('change', () => {
    const form = $('#plant-form');
    if (form.locationPreset.value === '其他') {
      form.locationCustom.style.display = 'block';
      form.locationCustom.focus();
    } else {
      form.locationCustom.style.display = 'none';
      form.locationCustom.value = '';
    }
  });

  $('#plant-save-btn').onclick = async (e) => {
    e.preventDefault();
    const form = $('#plant-form');
    const nickname = form.nickname.value.trim();
    const species = form.species.value.trim();
    const plantCategory = form.plantCategory.value;
    if (!nickname || !species || !plantCategory) {
      showToast('请填写昵称、品种和类别');
      return;
    }
    const location = form.locationPreset.value === '其他' ? form.locationCustom.value.trim() : form.locationPreset.value;
    const data = {
      id: id || ('plant_' + Date.now()),
      nickname,
      species,
      plantCategory,
      plantingDate: form.plantingDate.value || todayStr(),
      location,
      waterDemand: form.waterDemand.value,
      lightPreference: form.lightPreference.value,
      healthStatus: form.healthStatus.value,
      waterInterval: form.waterInterval.value ? parseInt(form.waterInterval.value) : null,
      notes: form.notes.value.trim(),
      imageList,
      isArchived: false
    };
    if (id) {
      const old = await dbGet(STORE_PLANTS, id);
      data.lastWateringDate = old.lastWateringDate;
      data.lastFertilizeDate = old.lastFertilizeDate;
      data.lastRepotDate = old.lastRepotDate;
      data.lastPestControlDate = old.lastPestControlDate;
      data.operationLog = old.operationLog || [];
      data.deathDate = old.deathDate;
      data.deathReason = old.deathReason;
      data.isArchived = old.isArchived;
      data.isExample = old.isExample;
    }
    await dbPut(STORE_PLANTS, data);
    showToast('保存成功 🌱');
    closeOverlay();
  };

  function checkSave() {
    const nickname = $('#plant-form').nickname.value.trim();
    const species = $('#plant-form').species.value.trim();
    const cat = $('#plant-form').plantCategory.value;
    $('#plant-save-btn').disabled = !(nickname && species && cat);
  }
  $('#plant-form').nickname.addEventListener('input', checkSave);
  $('#plant-form').species.addEventListener('input', checkSave);
  $('#plant-form').plantCategory.addEventListener('change', checkSave);
  checkSave();
}

async function openPlantDetail(id) {
  const p = await dbGet(STORE_PLANTS, id);
  if (!p) return;

  const cat = CATEGORY_MAP[p.plantCategory] || CATEGORY_MAP['其他'];
  const days = p.plantingDate ? daysFromNow(p.plantingDate) : 0;
  const tips = getTipsForCategory(p.plantCategory);
  const waterInterval = p.waterInterval || getDefaultWaterInterval(p.plantCategory);

  const rawLogs = p.operationLog || [];
  const showUndo = !p.isArchived;
  const logHTML = rawLogs.slice(-10).reverse().map((l, idx) => {
    const origIdx = rawLogs.length - 1 - idx;
    const [date, ...actionParts] = l.split(' ');
    const actionName = actionParts.join(' ');
    const canUndo = showUndo && (l.indexOf('（批量）') === -1);
    return `<div class="log-item" data-plant-id="${p.id}" data-log-idx="${origIdx}" data-action="${actionName}" data-can-undo="${canUndo}" style="display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--page-soft);font-size:13px;${canUndo ? 'cursor:pointer;' : ''}transition:background 0.15s;">
        <span style="color:var(--text-sub);min-width:90px;flex-shrink:0;">${formatDateCN(date, false)}</span>
        <span style="flex:1;min-width:0;">${actionName}</span>
      </div>`;
  }).join('');

  const photos = p.imageList || [];
  let photoHTML = '';
  if (photos.length === 0) {
    photoHTML = '<div style="text-align:center;color:var(--text-light);padding:20px;">还没有照片记录哦</div>';
  } else {
    window._currentPlantPhotos = photos;
    photoHTML = `
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
        ${photos.map((src, i) => `
          <div onclick="openPhotoViewer(window._currentPlantPhotos, ${i}, '${p.id}')" id="photo-${i}" style="width:80px;height:80px;border-radius:12px;overflow:hidden;cursor:pointer;border:2px solid transparent;">
            ${imgTag(src, '', 'width:100%;height:100%;object-fit:cover;')}
          </div>
        `).join('')}
      </div>
      <div id="compare-area" style="display:none;gap:8px;margin-top:8px;">
        <div style="flex:1;text-align:center;">
          <div id="compare-left" style="aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--page-soft);"></div>
          <div style="font-size:11px;color:var(--text-sub);margin-top:4px;">对比-左</div>
        </div>
        <div style="font-size:24px;align-self:center;">vs</div>
        <div style="flex:1;text-align:center;">
          <div id="compare-right" style="aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--page-soft);"></div>
          <div style="font-size:11px;color:var(--text-sub);margin-top:4px;">对比-右</div>
        </div>
      </div>
    `;
  }

  const editBtn = `<button onclick="openPlantForm('${p.id}')">编辑</button>`;

  // 频率分析
  const logs = p.operationLog || [];
  const waterLogs = logs.filter(l => l.includes('浇水') && l.indexOf('（批量）') === -1);
  const fertilizeLogs = logs.filter(l => l.includes('施肥') && l.indexOf('（批量）') === -1);
  const waterFreq = waterLogs.length >= 2
    ? Math.round(waterLogs.map(l => l.split(' ')[0]).sort().reduce((acc, date, i, arr) => {
        if (i === 0) return acc;
        acc.push(daysBetween(arr[i-1], date));
        return acc;
      }, []).reduce((s, v) => s + v, 0) / (waterLogs.length - 1))
    : null;
  const fertilizeFreq = fertilizeLogs.length >= 2

window.doPlantAction = async (id, action) => {
  const p = await dbGet(STORE_PLANTS, id);
  if (!p) return;
  const actionName = { water: '浇水', fertilize: '施肥', repot: '换盆', pest: '杀虫' }[action];
  const fieldMap = { water: 'lastWateringDate', fertilize: 'lastFertilizeDate', repot: 'lastRepotDate', pest: 'lastPestControlDate' };
  const lastDate = p[fieldMap[action]];

  if (action === 'water' && lastDate && daysFromNow(lastDate) < 1) {
    const gap = daysFromNow(lastDate);
    const confirmed = await showConfirm(
      '温馨提示',
      `距离上次浇水仅${gap === 0 ? '今天' : gap + '天'}，确定要再次浇水吗？`
    );
    if (!confirmed) return;
  } else {
    const confirmed = await showConfirm(
      `${actionName}`,
      `确定要为"${p.nickname}"${actionName}吗？`
    );
    if (!confirmed) return;
  }

  const today = todayStr();
  p[fieldMap[action]] = today;
  if (!p.operationLog) p.operationLog = [];
  p.operationLog.push(`${today} ${actionName}`);
  await dbPut(STORE_PLANTS, p);
  const emojiMap = { water: '💧', fertilize: '🌱', repot: '🪴', pest: '🐛' };
  showToast(`操作成功 ${emojiMap[action] || '🌿'}`);
  celebrate(emojiMap[action] || '🌿');
  openPlantDetail(id);
};

// 长按撤回执行
window.undoPlantLogLongPress = async (plantId, logIndex, actionName) => {
  const p = await dbGet(STORE_PLANTS, plantId);
  if (!p || p.isArchived) return;
  const logs = p.operationLog || [];
  if (logIndex < 0 || logIndex >= logs.length) return;
  logs.splice(logIndex, 1);
  const fieldMap = { '浇水': 'lastWateringDate', '施肥': 'lastFertilizeDate', '换盆': 'lastRepotDate', '杀虫': 'lastPestControlDate' };
  const field = fieldMap[actionName];
  if (field) {
    const sameActionLogs = logs.filter(l => l.includes(actionName) && l.indexOf('（批量）') === -1);
    let latestDate = '';
    if (sameActionLogs.length > 0) {
      latestDate = sameActionLogs.map(l => l.split(' ')[0]).sort((a, b) => b.localeCompare(a))[0];
    }
    p[field] = latestDate;
  }
  p.operationLog = logs;
  await dbPut(STORE_PLANTS, p);
  showToast(`已撤回「${actionName}」记录`);
  openPlantDetail(plantId);
};

window.exportPlantReport = async (id) => {
  const p = await dbGet(STORE_PLANTS, id);

  const cat = CATEGORY_MAP[p.plantCategory] || CATEGORY_MAP['其他'];
  const days = p.plantingDate ? daysFromNow(p.plantingDate) : 0;
  const logs = p.operationLog || [];

  const fertilizeCount = logs.filter(l => l.includes('施肥')).length;
  const repotCount = logs.filter(l => l.includes('换盆')).length;

  const canvas = document.createElement('canvas');
  canvas.width = 750; canvas.height = 1050;
  const ctx = canvas.getContext('2d');

  // 背景
  ctx.fillStyle = '#F7F9F6';
  ctx.fillRect(0, 0, 750, 1050);

  // 顶部色带
  const grad = ctx.createLinearGradient(0, 0, 750, 0);
  grad.addColorStop(0, cat.color);
  grad.addColorStop(1, '#A8C3A6');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 750, 180);

  // 标题
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 32px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('成长报告', 375, 70);
  ctx.font = '20px sans-serif';
  ctx.fillText(p.nickname, 375, 110);
  ctx.font = '14px sans-serif';
  ctx.fillText(`${p.species} · ${p.plantCategory}`, 375, 140);

  // 基本信息卡片
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.roundRect(30, 210, 690, 200, 20);
  ctx.fill();
  ctx.fillStyle = '#3D3D3D';
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('基本信息', 50, 245);
  ctx.font = '14px sans-serif';
  ctx.fillStyle = '#666';
  const info = [
    `种植日期：${formatDateCN(p.plantingDate)}`,
    `陪伴天数：${days} 天`,
    `养护位置：${p.location || '未设置'}`,
    `健康状态：${p.healthStatus || '健康'}`,
    `浇水偏好：${p.waterDemand || '-'}`,
    `光照需求：${p.lightPreference || '-'}`,
  ];
  info.forEach((line, i) => {
    ctx.fillText(line, 50, 280 + i * 25);
  });

  // 养护统计
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.roundRect(30, 430, 690, 220, 20);
  ctx.fill();
  ctx.fillStyle = '#3D3D3D';
  ctx.font = 'bold 18px sans-serif';
  ctx.fillText('养护统计', 50, 465);
  ctx.font = 'bold 36px sans-serif';
  ctx.textAlign = 'center';
  const stats = [
    { label: '浇水', count: waterCount, color: '#4A90D9' },
    { label: '施肥', count: fertilizeCount, color: '#8FBC8F' },
    { label: '换盆', count: repotCount, color: '#E8A87C' },
    { label: '杀虫', count: pestCount, color: '#E07A5F' },
  ];
  stats.forEach((s, i) => {
    const x = 120 + i * 160;
    ctx.fillStyle = s.color;
    ctx.fillText(s.count, x, 530);
    ctx.fillStyle = '#999';
    ctx.font = '14px sans-serif';
    ctx.fillText(s.label, x, 560);
  });

  // 统计条
  const maxCount = Math.max(...stats.map(s => s.count), 1);
  stats.forEach((s, i) => {
    const x = 80 + i * 160;
    const barH = (s.count / maxCount) * 60;
    ctx.fillStyle = '#E8F0E6';
    ctx.fillRect(x - 30, 620, 60, 60);
    ctx.fillStyle = s.color;
    ctx.fillRect(x - 30, 620 + (60 - barH), 60, barH);
  });

  // 最近记录
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.roundRect(30, 670, 690, 300, 20);
  ctx.fill();
  ctx.fillStyle = '#3D3D3D';
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('最近养护记录', 50, 705);
  ctx.font = '13px sans-serif';
  ctx.fillStyle = '#666';
  const recentLogs = logs.slice(-8).reverse();
  if (recentLogs.length === 0) {
    ctx.fillText('暂无操作记录', 50, 740);
  } else {
    recentLogs.forEach((l, i) => {
      const [date, ...action] = l.split(' ');
      ctx.fillStyle = '#999';
      ctx.fillText(formatDateCN(date, false), 50, 740 + i * 28);
      ctx.fillStyle = '#3D3D3D';
      ctx.fillText(action.join(' '), 200, 740 + i * 28);
    });
  }

  // 底部
  ctx.fillStyle = '#BDBDBD';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`植间日记 · 生成于 ${formatDateCN(todayStr())}`, 375, 1010);
  ctx.fillText('让每一片叶子都有故事', 375, 1030);

  // 下载
  const a = document.createElement('a');
  a.download = `${p.nickname}_成长报告.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
  showToast('成长报告已生成 📊');
  celebrate('📊');
};

// ==================== 鲜切花 ====================
let flowerState = { search: '', sort: 'date' };

async function renderFlowerList() {
  const list = $('#flower-list');
  let flowers = await dbGetAll(STORE_FLOWERS);
  flowers = flowers.filter(f => !f.isWilted);

  // 搜索过滤
  if (flowerState.search) {
    const q = flowerState.search.toLowerCase();
    flowers = flowers.filter(f => (f.cutFlowerName || '').toLowerCase().includes(q));
  }

  // 排序
  if (flowerState.sort === 'remaining') {
    flowers.sort((a, b) => {
      const ra = (a.estimatedVaseLife || 7) - (a.purchaseDate ? daysFromNow(a.purchaseDate) : 0);
      const rb = (b.estimatedVaseLife || 7) - (b.purchaseDate ? daysFromNow(b.purchaseDate) : 0);
      return ra - rb;
    });
  } else if (flowerState.sort === 'name') {
    flowers.sort((a, b) => (a.cutFlowerName || '').localeCompare(b.cutFlowerName || ''));
  } else {
    flowers.sort((a, b) => (b.purchaseDate || '').localeCompare(a.purchaseDate || ''));
  }

  // 绑定搜索和排序事件（只绑定一次）
  const searchInput = $('#flower-search-input');
  if (!searchInput._bound) {
    searchInput._bound = true;
    searchInput.addEventListener('input', (e) => {
      flowerState.search = e.target.value.trim();
      renderFlowerList();
    });
    $('#flower-sort').addEventListener('change', (e) => {
      flowerState.sort = e.target.value;
      renderFlowerList();
    });
  }

  if (flowers.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-pot"><div class="empty-leaf" style="background:var(--warn-orange);"></div></div>
        <p>${flowerState.search ? '没有找到匹配的鲜花' : '还没有鲜花记录哦～'}</p>
        ${flowerState.search ? '' : '<button class="btn" style="margin-top:16px;" onclick="openFlowerForm()">💐 添加鲜花</button>'}
      </div>
    `;
    return;
  }

  list.innerHTML = `
    <div style="text-align:right;padding:0 16px 12px;">
      <button class="btn btn-sm" onclick="openFlowerForm()">➕ 添加鲜花</button>
    </div>
  ` + flowers.map(f => {
    const days = f.purchaseDate ? daysFromNow(f.purchaseDate) : 0;
    const remaining = (f.estimatedVaseLife || 7) - days;
    let borderColor = 'var(--milk-tea-dark)';
    let statusText = '';
    if (f.isWilted) {
      borderColor = 'var(--text-light)';
      statusText = '<span style="color:var(--text-light);">已凋谢，建议清理</span>';
    } else if (remaining <= 0) {
      borderColor = 'var(--text-light)';
      statusText = '<span style="color:var(--text-light);">已凋谢，建议清理</span>';
    } else if (remaining <= 3) {
      borderColor = 'var(--warn-orange)';
      statusText = `<span style="color:var(--warn-orange);">预计还剩 ${remaining} 天</span>`;
    } else {
      statusText = `<span style="color:var(--page-deep);">预计还剩 ${remaining} 天</span>`;
    }

    const remainingColor = remaining >= 5 ? 'var(--page-deep)' : (remaining >= 3 ? 'var(--warn-yellow)' : 'var(--warn-red)');

    const statusMap = {
      '未醒花': '未醒花',
      '醒花中': '醒花中',
      '已醒花': '已醒花',
      '已插瓶': '已插瓶'
    };

    return `
      <div class="flower-card" data-flower-id="${f.id}" style="margin:0 16px 12px;">
        <div class="card" style="border:2px solid ${borderColor};${f.isWilted?'opacity:0.6;':''}" onclick="openFlowerDetail('${f.id}')">
          <div style="display:flex;gap:12px;align-items:center;">
            <div style="width:56px;height:56px;border-radius:14px;overflow:hidden;flex-shrink:0;background:var(--page-soft);">
              ${f.imageList && f.imageList[0] ? imgTag(f.imageList[0], '', 'width:100%;height:100%;object-fit:cover;') : '<div class="img-placeholder" style="width:100%;height:100%;"></div>'}
            </div>
            <div style="flex:1;min-width:0;">
              <div style="font-weight:700;font-size:16px;">${f.cutFlowerName}</div>
              <div style="font-size:12px;color:var(--text-sub);">${formatDateCN(f.purchaseDate)} · ${statusMap[f.arrivalStatus] || '未醒花'}${f.price ? ' · ¥' + f.price : ''}</div>
              <div style="font-size:12px;margin-top:2px;">${statusText}</div>
            </div>
            <div style="text-align:right;flex-shrink:0;">
              <div style="font-size:18px;font-weight:700;color:${remainingColor};">剩余${Math.max(0,remaining)}天</div>
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');

  // 绑定长按删除 + 右滑浇水
  $$('.flower-card', list).forEach(el => {
    const fid = el.dataset.flowerId;
    bindLongPress(el, async () => {
      const f = await dbGet(STORE_FLOWERS, fid);
      if (!f) return;
      el.style.background = 'var(--milk-tea-dark)';
      setTimeout(() => el.style.background = '', 300);
      const ok = await showConfirm('删除鲜花', `确定要永久删除「${f.cutFlowerName}」吗？此操作不可恢复。`);
      if (ok) {
        await dbDelete(STORE_FLOWERS, fid);
        showToast(`已删除「${f.cutFlowerName}」`);
        renderFlowerList();
      }
    });
    // 右滑换水
    bindSwipe(el, {
      onSwipeRight: async () => {
        const f = await dbGet(STORE_FLOWERS, fid);
        if (!f || f.isWilted) return;
        const confirmed = await showConfirm('换水', `确定为"${f.cutFlowerName}"换水吗？`);
        if (confirmed) {
          f.lastWaterChangeDate = todayStr();
          if (!f.operationLog) f.operationLog = [];
          f.operationLog.push(`${todayStr()} 换水`);
          await dbPut(STORE_FLOWERS, f);
          showToast('换水成功 💧');
          celebrate('💧');
          renderFlowerList();
        }
      },
      rightText: '💧换水'
    });
  });
}

        <button type="submit" id="flower-save-btn" class="btn btn-block" style="margin-top:20px;">保存</button>
      </form>
    </div>
  `);

  let imageList = [];
  function renderFlowerPreview() {
    $('#flower-photo-preview').innerHTML = imageList.map((src, i) => `
      <div style="position:relative;width:80px;height:80px;border-radius:12px;overflow:hidden;">
        ${imgTag(src, '', 'width:100%;height:100%;object-fit:cover;')}
        <button type="button" onclick="removeFlowerFormPhoto(${i})" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.5);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;">×</button>
      </div>
    `).join('');
  }
  window.removeFlowerFormPhoto = (i) => { imageList.splice(i,1); renderFlowerPreview(); };

  $('#flower-photo-input').addEventListener('change', async (e) => {
    for (const f of Array.from(e.target.files)) {
      try {
        const r = await compressImage(f);
        imageList.push(r.data);
      } catch(err) {}
    }
    e.target.value = '';
    renderFlowerPreview();
  });

  if (id) {
    dbGet(STORE_FLOWERS, id).then(f => {
      if (!f) return;
      $('#flower-form').cutFlowerName.value = f.cutFlowerName;
      $('#flower-form').purchaseDate.value = f.purchaseDate || todayStr();
      $('#flower-form').estimatedVaseLife.value = f.estimatedVaseLife || 7;
      $('#flower-form').waterChangeInterval.value = f.waterChangeInterval || 2;
      $('#flower-form').price.value = f.price || '';
      $('#flower-form').shopName.value = f.shopName || '';
      imageList = f.imageList || [];
      renderFlowerPreview();
    });
  }

  $('#flower-save-btn').onclick = async (e) => {
    e.preventDefault();
    const form = $('#flower-form');
    const name = form.cutFlowerName.value.trim();
    if (!name) { showToast('请填写花名'); return; }
    const data = {
      id: id || ('flower_' + Date.now()),
      cutFlowerName: name,
      purchaseDate: form.purchaseDate.value || todayStr(),
      estimatedVaseLife: parseInt(form.estimatedVaseLife.value) || 7,
      waterChangeInterval: parseInt(form.waterChangeInterval.value) || 2,
      price: form.price.value ? parseFloat(form.price.value) : null,
      shopName: form.shopName.value.trim(),
      arrivalStatus: '未醒花',
      isWilted: false,
      imageList,
      operationLog: []
    };
    if (id) {
      const old = await dbGet(STORE_FLOWERS, id);
      Object.assign(data, {
        arrivalStatus: old.arrivalStatus,
        isWilted: old.isWilted,
        wiltDate: old.wiltDate,
        lastWaterChangeDate: old.lastWaterChangeDate,
        lastTrimDate: old.lastTrimDate,
        operationLog: old.operationLog || [],
        price: data.price !== null ? data.price : old.price,
        shopName: data.shopName || old.shopName,
        isExample: old.isExample
      });
    }
    await dbPut(STORE_FLOWERS, data);
    showToast('保存成功 💐');
    closeOverlay();
  };
}

// ==================== 养护日历 ====================
let calendarState = { year: null, month: null };

async function renderCalendar() {
  if (calendarState.year === null) {
    const now = nowInBeijing();
    calendarState.year = now.getFullYear();
    calendarState.month = now.getMonth();
  }

  const plants = await dbGetAll(STORE_PLANTS);
  const flowers = await dbGetAll(STORE_FLOWERS);
  const logMap = {};

  const collectLogs = (items) => {
    items.forEach(item => {
      const name = item.nickname || item.cutFlowerName || '未知';
      (item.operationLog || []).forEach(l => {
        const [date, ...actionParts] = l.split(' ');
        const action = actionParts.join(' ');
        if (!logMap[date]) logMap[date] = [];
        logMap[date].push({ name, action });
      });
    });
  };
  collectLogs(plants);
  collectLogs(flowers);

  const { year, month } = calendarState;
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const firstDay = new Date(year, month, 1).getDay();
  const today = todayStr();

  let calendarHTML = `
    <div style="padding:16px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <button onclick="calPrev()" style="background:var(--page-soft);border:none;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:18px;color:var(--text-main);">‹</button>
        <div style="font-size:20px;font-weight:700;">${year}年${monthNames[month]}</div>
        <button onclick="calNext()" style="background:var(--page-soft);border:none;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:18px;color:var(--text-main);">›</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:8px;">
        ${['日','一','二','三','四','五','六'].map(d => `<div style="font-size:12px;color:var(--text-sub);font-weight:600;padding:4px 0;">${d}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">
  `;

  for (let i = 0; i < firstDay; i++) {
    calendarHTML += '<div style="aspect-ratio:1;"></div>';
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasLog = !!logMap[dateStr];
    const isToday = dateStr === today;
    calendarHTML += `
      <div class="cal-day ${hasLog?'has-log':''} ${isToday?'today':''}" onclick="${hasLog ? `showDayLogs('${dateStr}')` : ''}">
        <span>${d}</span>
        ${hasLog ? '<div class="cal-dot"></div>' : ''}
      </div>
    `;
  }
  calendarHTML += '</div></div>';

  if (logMap[today]) {
    calendarHTML += `
      <div style="padding:0 16px;margin-top:16px;">
        <div style="font-size:16px;font-weight:700;margin-bottom:8px;">今日操作</div>
      </div>
      <div class="card">
        ${logMap[today].map(l => `<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--page-soft);font-size:13px;"><span style="color:var(--text-sub);min-width:80px;">${l.name}</span><span>${l.action}</span></div>`).join('')}
      </div>
    `;
  }

  $('#calendar-content').innerHTML = calendarHTML;
}

window.calPrev = () => {
  calendarState.month--;
  if (calendarState.month < 0) { calendarState.month = 11; calendarState.year--; }
  renderCalendar();
};
window.calNext = () => {
  calendarState.month++;
  if (calendarState.month > 11) { calendarState.month = 0; calendarState.year++; }
  renderCalendar();
};

window.showDayLogs = async (dateStr) => {
  const plants = await dbGetAll(STORE_PLANTS);
  const flowers = await dbGetAll(STORE_FLOWERS);
  const logs = [];
  plants.forEach(p => {
    (p.operationLog || []).forEach(l => {
      const [date, ...actionParts] = l.split(' ');
      if (date === dateStr) logs.push({ name: p.nickname, action: actionParts.join(' ') });
    });
  });
  flowers.forEach(f => {
    (f.operationLog || []).forEach(l => {
      const [date, ...actionParts] = l.split(' ');
      if (date === dateStr) logs.push({ name: f.cutFlowerName, action: actionParts.join(' ') });
    });
  });

  const logListHTML = logs.length === 0
    ? '<div style="text-align:center;color:var(--text-light);padding:20px;">当天没有操作记录</div>'
    : logs.map(l => `
      <div style="display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--page-soft);font-size:13px;">
        <span style="color:var(--text-sub);min-width:80px;">${l.name}</span>
        <span style="flex:1;">${l.action}</span>
      </div>
    `).join('');

  await showConfirm(formatDateCN(dateStr), '', null, `<div style="margin-top:8px;">${logListHTML}</div>`);
};

window.cycleMemorialPhoto = (plantId, photos) => {
  const img = $('#memorial-photo-' + plantId);
  const counter = $('#memorial-counter-' + plantId);
  if (!img || !photos || photos.length <= 1) return;
  const current = img.src;
  let idx = photos.indexOf(current);
  idx = (idx + 1) % photos.length;
  img.src = photos[idx];
  if (counter) counter.textContent = `${idx + 1}/${photos.length}`;
};

window.filterKnowledge = () => {
  const q = $('#kb-search').value.trim().toLowerCase();
  $$('.kb-item').forEach(el => {
    const title = el.dataset.title.toLowerCase();
    const content = el.dataset.content.toLowerCase();
    el.style.display = (title.includes(q) || content.includes(q)) ? 'block' : 'none';
  });
  // Hide empty category headers
  $$('#kb-content > div').forEach(catDiv => {
    const visible = $$('.kb-item', catDiv).some(item => item.style.display !== 'none');
    catDiv.style.display = visible ? 'block' : 'none';
  });
};

window.saveKbNote = async () => {
  const text = $('#kb-note').value.trim();
  if (!text) { showToast('请输入笔记内容'); return; }
  let notes = await dbGetMeta('kb_notes') || [];
  notes.unshift({ text, date: todayStr() });
  await dbSetMeta('kb_notes', notes);
  $('#kb-note').value = '';
  showToast('笔记已保存 📝');
  loadKbNotes();
};

window.loadKbNotes = async () => {
  const container = $('#kb-saved-notes');
  if (!container) return;
  const notes = await dbGetMeta('kb_notes') || [];
  if (notes.length === 0) {
    container.innerHTML = '<div style="font-size:12px;color:var(--text-light);text-align:center;">还没有笔记</div>';
    return;
  }
  container.innerHTML = notes.map((n, i) => `
    <div style="padding:8px;background:#fff;border-radius:8px;margin-bottom:6px;font-size:13px;">
      <div style="color:var(--text-sub);font-size:11px;margin-bottom:4px;">${formatDateCN(n.date, false)}</div>
      <div>${n.text}</div>
      <button onclick="deleteKbNote(${i})" style="background:none;border:none;color:var(--warn-red);font-size:11px;cursor:pointer;margin-top:4px;">删除</button>
    </div>
  `).join('');
};

window.deleteKbNote = async (i) => {
  let notes = await dbGetMeta('kb_notes') || [];
  notes.splice(i, 1);
  await dbSetMeta('kb_notes', notes);
  showToast('已删除');
  loadKbNotes();
};

// ==================== 养护小贴士 ====================
function getTipsForCategory(category) {
  const common = [
    '通风差，浇水后开窗或风扇吹1小时',
    '多肉易徒长，每3天转动花盆180°'
  ];
  const shaanxi = [
    '春秋干燥，观叶植物需叶面喷水',
    '冬季供暖温度高，浇水增加30%'
  ];
  if (category === '多肉植物') {
    return [...common, ...shaanxi, '夏季＞35℃控水至15-20天，傍晚浇', '冬季＜5℃断水'];
  }
  if (category === '观花植物') {
    return [...common, ...shaanxi, '月季易红蜘蛛，每周检查叶背', '喷牛奶水（1:10）防治红蜘蛛'];
  }
  if (category === '观叶植物') {
    return [...common, ...shaanxi];
  }
  return [...common, ...shaanxi];
}

// ==================== 数据导出导入 ====================
window.exportData = async () => {
  showLoading(true);
  try {
    const plants = await dbGetAll(STORE_PLANTS);
    const flowers = await dbGetAll(STORE_FLOWERS);
    const meta = {};
    const metaKeys = ['favorite_tips'];
    for (const k of metaKeys) {
      meta[k] = await dbGetMeta(k);
    }
    const data = {
      version: 1,
      exportDate: todayStr(),
      plants,
      flowers,
      meta
    };
    const json = JSON.stringify(data);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `植间日记_备份_${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('导出成功，请妥善保管 📁');
  } catch (err) {
    console.error(err);
    showToast('导出失败');
  }
  showLoading(false);
};

window.importData = async (event) => {
  const file = event.target.files[0];
  if (!file) return;
  event.target.value = '';
  const confirmed = await showConfirm('导入确认', '导入将覆盖当前所有数据，是否继续？');
  if (!confirmed) return;
  showLoading(true);
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data.plants || !data.flowers) throw new Error('invalid');
    const oldPlants = await dbGetAll(STORE_PLANTS);
    const oldFlowers = await dbGetAll(STORE_FLOWERS);
    for (const p of oldPlants) await dbDelete(STORE_PLANTS, p.id);
    for (const f of oldFlowers) await dbDelete(STORE_FLOWERS, f.id);
    for (const p of data.plants) await dbPut(STORE_PLANTS, p);
    for (const f of data.flowers) await dbPut(STORE_FLOWERS, f);
    if (data.meta) {
      for (const [k, v] of Object.entries(data.meta)) {
        if (v !== null) await dbSetMeta(k, v);
      }
    }
    showToast('导入成功 🎉');
    showLoading(false);
    closeOverlay();
    renderMe();
    renderHome();
  } catch (err) {
    console.error(err);
    showLoading(false);
    showToast('导入失败，文件格式不正确');
  }
};

// ==================== 初始化 ====================
async function init() {
  try {
    await openDB();
    await initSampleData();
  } catch (err) {
    console.error('初始化失败', err);
  }

  // 设置默认页面主题
  document.body.dataset.page = 'home';

  // Tab 切换
  $$('.tab-item').forEach(tab => {
    tab.onclick = () => switchPage(tab.dataset.page);
  });

  // 绑定批量操作事件委托
  bindBatchActions();

  // 绑定回顶按钮
  bindScrollTop();

  // 默认渲染首页
  renderHome();

  // 页面获得焦点时刷新首页待办
  window.addEventListener('focus', () => {
    if (currentPage === 'home') renderHome();
  });
}
